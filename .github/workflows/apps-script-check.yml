name: Apps Script bundle is up to date

# apps-script/index.html is what the Apps Script web app loads from GitHub.
# This fails if someone changed the app without running `npm run build:appsscript`.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:appsscript
      - run: git diff --exit-code apps-script/index.html || (echo "::error::Run npm run build:appsscript and commit apps-script/index.html" && exit 1)
