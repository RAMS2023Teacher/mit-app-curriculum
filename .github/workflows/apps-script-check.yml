name: Server tests and Apps Script bundle

# apps-script/index.html is what the Apps Script web app loads from GitHub.
# This fails if someone changed the app without running `npm run build:appsscript`.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test # storage reliability rules for apps-script/Code.gs
      - run: npm run build:appsscript
      - run: git diff --exit-code apps-script/ || (echo "::error::Run npm run build:appsscript and commit the apps-script folder (index.html, manifest.json, Code.gs)" && exit 1)
