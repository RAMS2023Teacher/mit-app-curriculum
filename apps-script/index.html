ur partner?`,options:[`Your partner is too busy`,`A fresh user does not already know how the app works, so you see where real people get confused`,`Fresh users find more bugs in the blocks`,`It is faster`],answer:1,explain:`You and your partner know how everything works. A new user shows you what is actually confusing.`},{q:`After fixing problems from testing, why change VersionName from 1.0 to 1.1?`,options:[`App Inventor requires it to build`,`It makes the app run faster`,`It tells users and your team this is a newer release with changes`,`It changes the app's icon`],answer:2,explain:`Version numbers track releases, so everyone knows which build they have.`}],checks:[{kind:`screenProp`,prop:`Icon`,label:`Sets a custom app Icon`},{kind:`screenProp`,prop:`AppName`,label:`Sets an AppName`},{kind:`screenProp`,prop:`VersionName`,label:`Updates the VersionName (e.g. 1.1)`},{kind:`totalBlocks`,min:40,label:`Has at least 40 blocks`}],teacherNotes:`Three periods: Day 1 identity, polish, build; Day 2 fresh-user test and pitch prep; Day 3 pitches, submission, reflection. Fresh users can be another class, younger students, or family (assign as homework if needed). All three pitch formats earn full credit; offer video or written privately to students with anxiety-related IEPs or newcomer ELLs. Builds can queue on MIT servers, so start early. School-managed Android devices may block .apk installs; the Companion is a fine demo. Read the individual reflections: they are your best evidence of what each student can do alone, and they feed into the Solo Challenge. Gallery publishing is public; check district policy.`}],Vn=[{id:`solo-build`,title:`Solo Challenge`,subtitle:`Build a new app on your own, from a written spec`,icon:`🧗`,track:`launch`,individual:!0,concepts:[`Planning from a spec`,`Choosing the right tools`,`Testing`,`Explaining your code`],periods:2,xp:{quiz:50,build:200,bonus:100},project:{name:`Your Solo App`,description:`Pick one spec card and build that app by yourself. No blocks are given. You decide which skills to use, then explain how your code works.`},objectives:[`Read a written spec and turn it into a plan`,`Choose and combine events, variables, conditionals, loops or Clock, lists, and procedures without step-by-step help`,`Test your app against a checklist`,`Explain how your code works in your own words`],intro:`You have built many apps with your company. Now it is your turn to show what **you** can do on your own. This time there are **no blocks** in the steps. You get a short spec (a description of what the app must do), and you decide how to build it. Every skill you need, you have already used.`,vocab:[{term:`Spec`,def:`A description of what an app must do, without saying how to build it.`},{term:`Requirement`,def:`One thing the app MUST do to meet the spec.`},{term:`Test checklist`,def:`A list of things to try to prove each requirement works.`}],ideas:[{title:`Flashcard Flipper`,pitch:`Required: a list of at least 5 questions and a matching list of answers. A "Flip" button shows the answer. A "Next" button goes to the next card and wraps back to card 1 after the last one. A label shows "Card 2 of 5".`,uses:[`lists`,`index variable`,`if (wrap around)`,`a showCard procedure`],stretch:`A "Shuffle" button that starts at a random card.`},{title:`Reaction Timer`,pitch:`Required: press Start, then after a random wait of 1 to 4 seconds the screen turns green. Tap as fast as you can. Show how many milliseconds you took. Tapping too early shows "Too soon!".`,uses:[`Clock`,`random integer`,`a global for the start time or a counter`,`if`,`procedures`],stretch:`Keep the best time in a variable and show it.`},{title:`Habit Counter`,pitch:`Required: track one habit (for example "glasses of water"). A + button and a − button change the count, which can never go below 0. At a goal you choose, show a message. A Reset button sets it back to 0.`,uses:[`global variable`,`if`,`a procedure that updates the label`],stretch:`Track 3 habits using a list.`},{title:`Random Team Picker`,pitch:`Required: type names and add them to a list shown on screen. A "Make Teams" button splits the names into Team A and Team B by taking turns. A Clear button empties the list.`,uses:[`lists`,`for each item loop`,`if`,`a procedure`],stretch:`Shuffle the names before splitting them.`}],steps:[{title:`Read the spec and plan`,body:`Pick ONE spec card below. Read it twice. Then, on paper or in the notes box, write each requirement as a numbered list, sketch your screen, and fill in the frames. You work **alone** on this challenge. You may look at your old projects, but not at a classmate's screen.`,simple:`Choose one card. Write each thing the app must do as a list. Draw your screen. Work alone.`,frames:[`My app must: 1. ___ 2. ___ 3. ___`,`I will need these components: ___.`,`I will need these variables: ___. They start at ___.`,`One procedure I will make is ___. It will ___.`]},{title:`Which skills do I need?`,body:`Use this table to choose your tools:

- Something happens when the user taps → an **event** (\`when … Click\`)
- The app must remember a number or word → a **global variable**
- The app must choose between two things → **if / else**
- Something repeats every second → a **Clock**
- Do the same thing to many items → a **list** + **for each**
- The same blocks are needed in two places → a **procedure**`,simple:`Tap → event. Remember → variable. Choose → if. Repeat each second → Clock. Many items → list. Same blocks twice → procedure.`},{title:`Build it`,editor:`blocks`,body:`Build one requirement at a time, and test each one on your phone before starting the next. No blocks are given. If you get stuck, use the stuck steps: read the error, test one block with **Do It**, check names, look at an old project that did something similar, then ask your teacher (say what you tried).`,simple:`Build one part. Test it. Then build the next part. If you are stuck, look at your old projects first.`,check:`Done when: every requirement on your list works on your phone.`,stuck:[`Not sure where to start? Build the Designer first, then the event that happens first.`,`Find an old project that did something similar (Decision Maker for lists, Rocket Countdown for Clock, Tip Splitter for procedures).`]},{title:`Test with a checklist`,editor:`phone`,day:2,body:`For each requirement, write one test and try it: what you did, what you expected, what happened. Also try to **break** your app: tap buttons in a strange order, tap very fast, leave boxes empty. Fix what breaks.`,simple:`Test each requirement. Write what you did and what happened. Try to break the app, then fix it.`,frames:[`Test: I ___. I expected ___. It ___.`,`I tried to break it by ___. Then I fixed ___.`],check:`Done when: every test on your list passes.`},{title:`Explain your code`,body:"Export your `.aia` and submit it. In the notes, explain your code in your own words using the frames. Your teacher may also ask you to explain one part out loud.",simple:`Submit your project. Explain how your code works using the sentence starters.`,frames:[`The variable ___ stores ___. It changes when ___.`,`This if checks ___ because ___.`,`My procedure ___ does ___. I made it a procedure because ___.`,`The hardest part was ___. I solved it by ___.`]}],devices:[{need:`No phone to  build, and the company earns its XP only when each member is approved. Assess with four criteria (0–3 each): (1) Works: the requirements on the card work on a phone. (2) Concepts: uses at least 3 of events, variables, conditionals, loops/Clock, lists, procedures, and uses them correctly. (3) Organized: at least one procedure that removes repeated blocks; meaningful names. (4) Explains: the written frames (and an optional 1-minute conversation) show the student understands their own code. Students may look at their own old projects but not classmates' screens. The spec cards are sized for 2 periods; Habit Counter is the most accessible, Reaction Timer the hardest. For students with IEPs, allow extra time or a reduced requirement list rather than giving blocks.`}],Hn=[{lessonId:`core-hello`,col:3,row:0,prereqs:[],prereqMode:`all`},{lessonId:`core-events`,col:3,row:1,prereqs:[`core-hello`],prereqMode:`all`},{lessonId:`side-design`,col:5,row:1.5,prereqs:[`core-events`],prereqMode:`all`,optional:!0},{lessonId:`core-variables`,col:3,row:2,prereqs:[`core-events`],prereqMode:`all`},{lessonId:`core-conditionals`,col:3,row:3,prereqs:[`core-variables`],prereqMode:`all`},{lessonId:`side-debug`,col:1,row:3.5,prereqs:[`core-conditionals`],prereqMode:`all`,optional:!0},{lessonId:`mini-quiz`,col:1,row:4.6,prereqs:[`core-conditionals`],prereqMode:`all`,branchId:`mini`},{lessonId:`mini-sound`,col:3,row:4.6,prereqs:[`core-conditionals`],prereqMode:`all`,branchId:`mini`},{lessonId:`mini-convert`,col:5,row:4.6,prereqs:[`core-conditionals`],prereqMode:`all`,branchId:`mini`},{lessonId:`core-loops`,col:3,row:6,prereqs:[`mini-quiz`,`mini-sound`,`mini-convert`],prereqMode:`any`},{lessonId:`core-lists`,col:3,row:7,prereqs:[`core-loops`],prereqMode:`all`},{lessonId:`core-procedures`,col:3,row:8,prereqs:[`core-lists`],prereqMode:`all`},{lessonId:`games-sprites`,col:1,row:9.6,prereqs:[`core-procedures`],prereqMode:`all`,branchId:`path`},{lessonId:`games-motion`,col:1,row:10.6,prereqs:[`games-sp e Blocks editor and the AI Companion, and what each one is for.`},{code:`6-8.CS.a.2`,how:`Sees apps as application software they can create, not only use.`},{code:`6-8.CS.a.7`,how:`Troubleshoots the Companion connection: Wi-Fi network, reconnecting, sound volume.`}],"core-events":[{code:`6-8.CT.d.3`,how:`Builds Mood Switcher, an app driven by Click, LongClick and Initialize events.`},{code:`6-8.CT.b.2`,how:`Each input (tap, long-press, app start) produces a specific, testable output.`},{code:`6-8.CS.a.4`,how:`Bonus: uses the accelerometer sensor to trigger an event.`}],"side-design":[{code:`6-8.DTC.a.4`,how:`Designs a polished, multimedia "about us" screen using layout tools.`},{code:`6-8.DTC.a.3`,how:`Combines an image file, text and buttons into one finished screen.`},{code:`6-8.CT.a.3`,how:`Breaks the screen into nested arrangements (a hierarchy of containers).`}],"core-variables":[{code:`6-8.CT.d.4`,how:`Uses variables and math expressions to track coins and upgrades.`},{code:`6-8.CT.c.2`,how:`The "numbers vs. text" experiment shows how the app stores and handles different data types.`},{code:`6-8.CT.d.3`,how:`Builds the Tap Tycoon clicker game in pairs.`}],"core-conditionals":[{code:`6-8.CT.b.1`,how:`Designs a solution with if / else if / else.`},{code:`6-8.CT.b.2`,how:`Play-tests guesses and predicts "too high" or "too low" for each input.`},{code:`6-8.CT.b.5`,how:`"Guard against bad input" handles blank entries and the 1–100 range.`},{code:`6-8.CT.d.4`,how:`Combines variables, comparisons and conditionals in one program.`}],"side-debug":[{code:`6-8.CT.d.6`,how:`Finds and fixes three bugs through repeated test-and-fix cycles.`},{code:`6-8.CT.d.5`,how:`Inspects values with Do It and traces the buggy code step by step.`},{code:`6-8.CS.a.7`,how:`Follows a routine for diagnosing software problems (warnings, errors, values).`}],"mini-quiz":[{code:`6-8.CT.b.1`,how:`Checks each answer with conditionals.`},{code:`6-8.CT.d.4`,how:`Uses score and question-number variables with conditionals and expressions.`},{code:`6-8.CT.d.3`,how:`Builds a complete trivia game in pairs.`}],"mini-sound":[{code:`6-8.DTC.a.2`,how:`Works with image and audio file types (PNG, JPG, MP3, WAV) and why each exists.`},{code:`6-8.DTC.a.3`,how:`Combines image and audio files into one soundboard app.`},{code:`6-8.CT.b.1`,how:`A boolean mute mode decides with if / else whether to play.`},{code:`6-8.CAS.b.3`,how:`Talk it over: when is it fair to use a sound clip you found online?`}],"mini-convert":[{code:`6-8.CT.d.4`,how:`Writes math expressions for the conversion formulas.`},{code:`6-8.CT.b.5`,how:`Validates input and "tries to break it" with empty or odd values.`},{code:`6-8.CT.b.2`,how:`Predicts converted values for given inputs and checks them.`}],"core-loops":[{code:`6-8.CT.b.1`,how:`Uses repetition: a Clock timer and a for-each-number loop.`},{code:`6-8.CT.b.4`,how:`"Timer or loop?" compares two ways to repeat and when each fits.`},{code:`6-8.CT.d.4`,how:`Implements looping behavior with a counter variable and conditionals.`}],"core-lists":[{code:`6-8.CT.d.4`,how:`Uses list variables, expressions and loops together.`},{code:`6-8.CT.b.1`,how:`Uses "for each item" repetition to process every option.`},{code:`6-8.CT.d.3`,how:`Builds Decision Maker to solve an everyday problem.`}],"core-procedures":[{code:`6-8.CT.a.2`,how:`Defines calculateTip once and reuses it for every tip button.`},{code:`6-8.CT.d.2`,how:`Procedures hide the math details from the button handlers.`},{code:`6-8.CT.d.1`,how:`Compares the repetitive version with the procedure version (length, effort to change).`},{code:`6-8.CT.d.4`,how:`Uses functions with parameters and return values.`}],"games-sprites":[{code:`6-8.CT.a.1`,how:`Represents a position on screen with x and y coordinates.`},{code:`6-8.CT.b.5`,how:`Keeps the bug on screen with Canvas.Width − Bug.Width as the boundary.`},{code:`6-8.CT.d.3`,how:`Builds the Bug Tap game in pairs.`}],"games-motion":[{code:`6-8.CT.e.1`,how:`Models mot
