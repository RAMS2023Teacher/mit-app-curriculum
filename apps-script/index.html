Then add a guard: if the quantity is more than the stock, show \`"Not enough chips!"\` instead of selling. **Fill the blank** with the comparison that means "more than".`,simple:`Fix the bugs one at a time. Test after each fix. Then add an if block so nobody can buy more chips than you have.`,blocks:[`when BuyButton.Click do`,`  if QtyBox.Text ___ get global stock`,`    call Notifier1.ShowAlert(notice: "Not enough chips!")`,`  else`,`    set TotalLabel.Text to: join("Total: $", QtyBox.Text × 2)`,`    set global stock to: (get global stock) - QtyBox.Text`,`    set StockLabel.Text to: join("In stock: ", get global stock)`],check:`Test now: buy 3 chips. Total shows $6 and stock shows 7. Then try to buy 20: you see "Not enough chips!"`,stuck:[`Changed two things and now it is worse? Undo one change and test again. Change one thing at a time.`,`An empty QtyBox still causes an error? Add an "is empty" check first, like in Guess My Number.`]},{title:`Write the case report and submit`,body:"Do the **Remix**. Then, in the **note** box when you submit, write a short case report. For each of the 3 bugs, say **what went wrong**, **how you found it**, and **how you fixed it**. Export your fixed `.aia` and submit it.",simple:`Do the Remix. Write what each bug was, how you found it, and how you fixed it. Then submit.`,frames:[`Bug 1: The app ___. We found it by ___. We fixed it by ___.`,`Bug 2: The app ___. We found it by ___. We fixed it by ___.`,`Bug 3: The app ___. We found it by ___. We fixed it by ___.`]}],remix:{title:`Remix: Restock`,spec:`Add a Restock button. When it is tapped, stock goes back to 10, the stock label updates, and a pop-up says "Restocked!".`,hints:[`Set the stock variable, then set the label, then call the Notifier.`,`Test: buy 4 chips, tap Restock, and check the label says In stock: 10.`]},challenge:{title:`Bonus: Plant a bug`,body:`Make a copy of a working app (**Projects → Save project as** makes a copy with a new name) and secretly plant ONE bug. Trade with another company and race to find each other's bugs. Describe the bug you solved in your notes.`},quiz:[{q:`A block sits on the workspace but is not inside any "when" event. What happens to it?`,options:[`It runs when the app starts`,`It never runs`,`It runs every second`,`It runs after every click`],answer:1,explain:`Blocks only run when an event starts them (except initialize global). Loose blocks get a warning.`},{q:`stock is 10. The user types 4 and taps Buy (your fixed blocks). Then types 7 and taps Buy again. What does StockLabel show?`,options:[`In stock: 6`,`In stock: -1`,`In stock: 3`,`In stock: 10`],answer:0,explain:`First buy: 10 − 4 = 6. Second buy: 7 is more than 6, so the guard shows "Not enough chips!" and stock stays 6.`},{q:`A variable starts as "ten" and the app crashes when you subtract from it. What kind of bug is this?`,options:[`A wrong component`,`A text vs. number (data type) bug`,`A layout bug`,`A Companion bug`],answer:1,explain:`Math needs numbers. Use the number block 10, not the text "ten".`},{q:`What is the BEST debugging strategy?`,options:[`Change lots of blocks at once and hope`,`Delete the project and start over`,`Test one idea at a time and check values as the app runs`,`Ask your partner to fix it`],answer:2,explain:`Change one thing, test, and collect evidence. Then you know which change fixed it.`}],checks:[{kind:`component`,type:`Notifier`,label:`Has a Notifier`},{kind:`method`,method:`ShowAlert`,label:`Calls Notifier.ShowAlert`},{kind:`block`,type:`controls_if`,label:`Guards with an if block`},{kind:`block`,type:`global_declaration`,label:`Has the stock variable`},{kind:`event`,component:`Button`,event:`Click`,label:`Uses BuyButton.Click`}],teacherNotes:`Best right after Conditionals, when students have enough code to make interesting bugs. The three planted bugs are the most common ones in student projects all year: type mismatch, disabled or loose blocks, and missing screen updates. Do It requires a live Companion connection. The case report in the submission notes is the real assessment; look for evidence-based reasoning ("we used Do It and saw...") rather than guessing. The .aia checker cannot tell whether bugs were fixed, so test the app or read the blocks when you review.`}],In=[{id:`mini-quiz`,title:`Quiz Show`,subtitle:`A trivia game that keeps score`,icon:`🎯`,track:`mini`,concepts:[`Global variables`,`If / else if / else`,`Comparing text`,`Notifier`],periods:3,xp:{quiz:40,build:120,bonus:40},project:{name:`Quiz Show`,description:`A three-question trivia game. Players pick an answer, get instant feedback, tap Next, and see their final score at the end.`},objectives:[`Use global variables (score, questionNumber, correct) to track the state of a game`,`Use if / else if / else to decide which question to show`,`Compare the player's answer to the correct answer and update the score`,`Show pop-up feedback with a Notifier and hide or show buttons with Visible`],intro:`For a game company, the big question is: **is it fun to play?** Your first product is a quiz show. Behind the scenes, the app must *remember* three things the whole time: which question the player is on, the right answer to that question, and how many they got right. That memory lives in **global variables**, and **if** blocks decide what happens next.`,vocab:[{term:`Global variable`,def:`A named value that every block on the screen can read and change, like score.`},{term:`State`,def:`Everything the app is remembering right now (current question, score, and so on).`},{term:`Condition`,def:`A true-or-false question, like "is this answer the correct one?"`},{term:`Notifier`,def:`A component that shows pop-up messages.`}],steps:[{title:`Design the game screen (your topic!)`,editor:`designer`,body:"**Your choice:** pick a quiz topic (sports, animals, music, your school...).\n\nStart a project called `QuizShow`. Add:\n\n- A **Label** `QuestionLabel` (FontSize 20 or more)\n- Three **Buttons**: `AnswerA`, `AnswerB`, `AnswerC`\n- A **Button** `NextButton` (Text `Next ▶`). Uncheck its **Visible** box so it starts hidden.\n- A **Label** `ScoreLabel` (Text `Score: 0`)\n- A **Notifier** (User Interface drawer)",simple:`Pick a quiz topic. Add a question label, three answer buttons, a hidden Next button, a score label, and a Notifier.`,check:`Test now: the phone shows the question label and three buttons. The Next button is hidden.`,stuck:[`You can see hidden parts in the Designer if you check "Display hidden components in Viewer".`],newBlocks:[{name:`Visible`,where:`Properties panel (or set … Visible in Blocks)`,what:`Shows or hides a part of the screen.`},{name:`Notifier`,where:`Palette → User Interface`,what:`Shows pop-up messages.`}]},{title:`Create the game's memory (fill the blank)`,editor:`blocks`,body:"Make three `initialize global` blocks: `score` starts at `0`, `questionNumber` starts at `1`, and `correct` will hold the right answer for the current question. **Fill the blank** for `correct` with an empty text block (Text drawer). The question blocks will fill it in.",simple:`Make three variables: score (0), questionNumber (1), and correct (empty text).`,blocks:[`initialize global score to: 0`,`initialize global questionNumber to: 1`,`initialize global correct to: ___`]},{title:`Show question 1`,editor:`blocks`,body:"Put an **if** block in `when Screen1.Initialize`. Use the blue gear to add two **else if** parts. For each question number, set the question text, the three answer texts, **and** the `correct` variable.\n\nQuestion 1 is shown. **Write your own questions 2 and 3** in the blanks.",simple:`When the app opens, show question 1. For each question, set the question, the three answers, and the right answer.`,blocks:[`when Screen1.Initialize do`,`  if get global questionNumber = 1`,`    set QuestionLabel.Text to: "What planet is closest to the sun?"`,`    set AnswerA.Text to: "Venus"`,`    set AnswerB.Text to: "Mercury"`,`    set AnswerC.Text to: "Mars"`,`    set global correct to: "Mercury"`,`  else if get global questionNumber = 2`,`    ...set the question, 3 answers, and correct for question 2: ___`,`  else if get global questionNumber = 3`,`    ...set the question, 3 answers, and correct for question 3: ___`],check:`Test now: refresh the Companion. Question 1 and its three answers appear.`,stuck:[`The correct text must match the button text exactly, including capital letters and spaces.`]},{title:`Check the answer`,editor:`blocks`,day:2,body:"This goes in `when AnswerA.Click`. Compare the button's own text to `correct`. If they match, add 1 to `score`. Either way, show a message, update the score, turn off the answer buttons (so nobody taps twice), and show **Next**.",simple:`When an answer is tapped, check if its text equals the right answer. Add a point if it does. Then show the Next button.`,blocks:[`when AnswerA.Click do`,`  if AnswerA.Text = get global correct`,`    set global score to: (get global score) + 1`,`    call Notifier1.ShowAlert(notice: "Correct!")`,`  else`,`    call Notifier1.ShowAlert(notice: join("Nope! It was ", get global correct))`,`  set ScoreLabel.Text to: join("Score: ", get global score)`,`  set AnswerA.Enabled to: false`,`  set AnswerB.Enabled to: false`,`  set AnswerC.Enabled to: false`,`  set NextButton.Visible to: true`],check:`Test now: tap the right answer for question 1. You see "Correct!", the score goes to 1, and Next appears.`,stuck:[`Use the green Logic = block or the Text compare block to compare text.`]},{title:`Answers B and C (words only)`,editor:`blocks`,body:"Build `when AnswerB.Click` and `when AnswerC.Click` yourself. They are the same as AnswerA, but the **if** compares *that* button's text. Tip: right-click → **Duplicate**, then change the button name in the event and in the if test. (The Enabled and Visible lines stay the same.)",simple:`Make the same blocks for AnswerB and AnswerC. Change which button's text is checked.`,check:`Test now: on question 1, tap a wrong answer. You see "Nope! It was Mercury" and the score does not change.`,stuck:[`Red "duplicate event handler" error? The copy still says AnswerA in the event. Change the dropdown.`]},{title:`Move to the next question`,editor:`blocks`,body:"This goes in `when NextButton.Click`. Add 1 to `questionNumber`, hide Next, and turn the answers back on. Then: if `questionNumber > 3`, the game is over, so show the final score and hide the three answer buttons. **Else**, show the new question: copy the whole **if** block from Screen1.Initialize (right-click → **Duplicate**) and drop it into the else.",simple:`Next adds 1 to the question number. After question 3, show "Game over". Otherwise, show the next question.`,blocks:[`when NextButton.Click do`,`  set global questionNumber to: (get global questionNumber) + 1`,`  set NextButton.Visible to: false`,`  set AnswerA.Enabled to: true   (and B, and C)`,`  if get global questionNumber > 3`,`    set QuestionLabel.Text to: join("Game over! You scored ", get global score)`,`    set AnswerA.Visible to: false   (and B, and C)`,`  else`,`    ...a copy of the "show the question" if block...`],check:`Test now: answer all 3 questions. After the last Next, you see "Game over!" with your score.`,stuck:[`Next shows the wrong question? The +1 block must come BEFORE the copied if block.`,`Copying feels like a lot? It is. In the Procedures lesson you will learn how to avoid it.`]},{title:`Playtest, remix, submit`,editor:`phone`,day:3,body:"Have someone from another company play *without* seeing the answers. Does the score count correctly? Does the game end after question 3? Then do the **Remix**, export the `.aia`, and submit it.",simple:`Let someone else play. Check the score and the ending. Do the Remix and submit.`,frames:[`Our tester said ___.`,`We changed ___ because ___.`]}],remix:{title:`Remix: Question 4`,spec:`Add a fourth question. The game should now end after question 4, not 3.`,hints:[`Add one more else if to BOTH copies of the "show the question" block.`,`Find the number 3 in the game-over test and change it.`]},challenge:{title:`Bonus: Play again`,body:"Add a **Play Again** button that only appears when the game is over. It resets `score` to 0 and `questionNumber` to 1, shows the answer buttons again, and shows question 1. Extra bonus: show a different message for a perfect score."},quiz:[{q:`Why are score and questionNumber global variables instead of just text in Labels?`,options:[`Globals are faster to type`,`The app needs to remember and change those values in many different events`,`Labels cannot show numbers`,`Global variables appear on the screen automatically`],answer:1,explain:`Every answer button and the Next button need to read and change them. A global variable is the app's shared memory.`},{q:`score is 1, questionNumber is 2, and correct is "Paris". AnswerC's text is "Paris". The player taps AnswerC. What does ScoreLabel show?`,options:[`Score: 1`,`Score: 2`,`Score: 3`,`Score: Paris`],answer:1,explain:`AnswerC.Text equals correct, so score goes from 1 to 2, and the label shows Score: 2.`},{q:`An if block has an "else" part. When does the else part run?`,options:[`Always`,`Only when the test is true`,`Only when the test is false`,`Never, it is optional`],answer:2,explain:`else is the "otherwise" path: it runs only when the if test is false.`},{q:`The game never ends after question 3. Which bug is MOST likely?`,options:[`The Notifier is missing`,`questionNumber is never increased, so it stays at 1`,`The Labels are too small`,`score is a global variable`],answer:1,explain:`If questionNumber never changes, "questionNumber > 3" can never become true.`}],checks:[{kind:`block`,type:`global_declaration`,min:3,label:`Has at least 3 global variables`},{kind:`block`,type:`controls_if`,label:`Uses an if block`},{kind:`block`,type:`lexical_variable_set`,label:`Changes a variable with a set block`},{kind:`component`,type:`Notifier`,label:`Has a Notifier`},{kind:`method`,method:`ShowAlert`,label:`Calls Notifier.ShowAlert`},{kind:`eventCount`,min:5,label:`Has at least 5 event handlers`}],teacherNotes:`The design is: Initialize shows question 1; each answer button grades against global correct and reveals Next; Next advances and shows the next question. The "show the question" block appears twice on purpose; it sets up the "why" for procedures. Text comparison is exact (capitals and spaces matter). Disabling the answer buttons after a tap stops score-farming. Ask partners to trace the variable values on paper for one full play-through.`},{id:`mini-sound`,title:`Soundboard`,subtitle:`Picture buttons that play sound clips`,icon:`🔊`,track:`mini`,concepts:[`Media files`,`Sound vs. Player`,`Boolean variables`,`If / else`],periods:3,xp:{quiz:40,build:120,bonus:40},project:{name:`Soundboard`,description:`A grid of picture buttons that each play a sound clip, plus a Mute switch and a music button for background music.`},objectives:[`Upload image and sound files as media`,`Choose between the Sound component (short clips) and the Player component (longer audio)`,`Use a true/false global variable to remember a mode (muted or not)`,`Use if / else to change what a button does based on that mode`],intro:`Media companies make apps that look and sound great. A **soundboard** is a grid of buttons that each play a clip, like a drum kit or animal noises. To make it feel like a real product, you will add a **mute mode** that the app remembers with a **boolean** (true/false) variable.`,vocab:[{term:`Media file`,def:`A file (picture, sound, video) uploaded into your project.`},{term:`Sound`,def:`Component for short sound effects. Plays right away, good for taps.`},{term:`Player`,def:`Component for longer audio like music. Can stop and loop.`},{term:`Boolean`,def:`A value that is either true or false.`}],steps:[{title:`Collect and upload media (your theme!)`,editor:`designer`,body:"**Your choice:** pick a theme (drums, animals, game sounds, your own voice...).\n\nStart a project called `Soundboard`. Find 4 short sound clips (`.mp3` or `.wav`) and 4 matching pictures. Use free, school-safe sources your teacher approves, or record your own.\n\nUnder **Media** (bottom of the Components panel), click **Upload File** for each one. Keep each file under 1 MB.",simple:`Pick a theme. Find 4 short sounds and 4 pictures. Upload them in the Media panel.`,stuck:[`Big files load slowly or not at all. Use short clips (a few seconds) and small pictures.`],newBlocks:[{name:`Upload File`,where:`Media panel, under Components`,what:`Adds a picture or sound file to your project.`}]},{title:`Build the button grid`,editor:`designer`,body:"1. Add a **TableArrangement** (Layout drawer) with 2 columns and 2 rows.\n2. Drop a **Button** into each box. Set each button's **Image** to one of your pictures and clear its **Text**.\n3. Add one **Sound** (Media drawer) for effects and one **Player** for music.\n4. Add a Button `MuteButton` (Text `Mute: OFF`) and a Button `MusicButton` (Text `Play music`).",simple:`Make a 2 by 2 grid of picture buttons. Add a Sound, a Player, a Mute button, and a Music button.`,check:`Test now: your phone shows four picture buttons in a grid.`,newBlocks:[{name:`TableArrangement`,where:`Palette → Layout`,what:`A grid with rows and columns.`},{name:`Sound`,where:`Palette → Media`,what:`Plays short sound effects.`},{name:`Player`,where:`Palette → Media`,what:`Plays longer audio, like music, and can loop.`}]},{title:`Play a clip on tap`,editor:`blocks`,body:"One Sound component can play many clips: change its **Source** before calling **Play**. The file name must match the uploaded file exactly, including `.mp3`.",simple:`When a picture button is tapped, set the Sound source to one file, then play it.`,blocks:[`when Button1.Click do`,`  set Sound1.Source to: "drum.mp3"`,`  call Sound1.Play`],check:`Test now: tap the first picture. Its sound plays.`,stuck:[`No sound? File names must match exactly, including capital letters. "Drum.mp3" is not "drum.mp3".`,`Still no sound? Check the phone or Chromebook is not muted.`]},{title:`The other three buttons (words only)`,editor:`blocks`,body:`Build the Click handlers for your other three picture buttons yourself. Each one uses its own sound file.`,simple:`Make the same blocks for your other three buttons, each with its own sound file.`,check:`Test now: all four buttons play different sounds.`},{title:`Add mute mode with a boolean (fill the blank)`,editor:`blocks`,day:2,body:"Make a global variable `muted` set to `false` (Logic drawer). When MuteButton is clicked, flip it: true becomes false, false becomes true. **Fill the blank** with **not** (Logic drawer) holding `get global muted`. Then update the button text.",simple:`Make a variable muted that starts false. The Mute button flips it, then changes its own text.`,blocks:[`initialize global muted to: false`,`when MuteButton.Click do`,`  set global muted to: ___`,`  if get global muted`,`    set MuteButton.Text to: "Mute: ON"`,`  else`,`    set MuteButton.Text to: "Mute: OFF"`],check:`Test now: tap Mute twice. The text goes to "Mute: ON", then back to "Mute: OFF".`,newBlocks:[{name:`true / false`,where:`Logic drawer`,what:`The two boolean values.`},{name:`not`,where:`Logic drawer`,what:`Flips true to false, and false to true.`}]},{title:`Respect the mute setting (fill the blank)`,editor:`blocks`,body:`Go back to each sound button and put the two blocks inside an **if**. **Fill the blank** so the sound only plays when the app is *not* muted. The big idea: **the same event can do different things depending on what the app remembers.**`,simple:`Each picture button should only play when the app is not muted.`,blocks:[`when Button1.Click do`,`  if ___`,`    set Sound1.Source to: "drum.mp3"`,`    call Sound1.Play`],check:`Test now: turn Mute ON. Tapping a picture plays nothing. Turn it OFF and it plays again.`},{title:`Background music with Player`,editor:`blocks`,body:`In the Designer, set **Player1.Source** to a music file and check **Loop**. In Blocks, make MusicButton start the music, or stop it if it is already playing. **Player1.IsPlaying** is true while music plays.`,simple:`The Music button starts the music, or stops it if it is already playing.`,blocks:[`when MusicButton.Click do`,`  if Player1.IsPlaying`,`    call Player1.Stop`,`    set MusicButton.Text to: "Play music"`,`  else`,`    call Player1.Start`,`    set MusicButton.Text to: "Stop music"`],check:`Test now: tap Music. Music plays and the button says "Stop music". Tap again and it stops.`},{title:`Test, remix, submit`,editor:`phone`,day:3,body:"Test every button with the volume up, then turn Mute ON and make sure nothing plays. Do the **Remix**, export the `.aia`, and submit it.",simple:`Test every button and the mute. Do the Remix and submit.`}],remix:{title:`Remix: Surprise button`,spec:`Add a Surprise button. When it is tapped (and the app is not muted), it plays one of your four sounds, chosen at random.`,hints:[`Use random integer from 1 to 4 and save it in a variable.`,`Use if / else if to pick the Source for each number.`,`Do not forget the mute check.`]},devices:[{need:`Phone has a silent switch (iPhone)`,fallback:`Flip the switch off silent. Sound and Player follow it.`},{need:`School computer blocks sound`,fallback:`Test on a phone with the Companion, or use headphones.`}],challenge:{title:`Bonus: Make it vibrate`,body:`Sound has a **Vibrate** method (it shakes the phone). Add a third mode, "Vibrate only", that vibrates for 200 milliseconds instead of playing a sound. Hint: use a number variable for the mode (0 = sound, 1 = mute, 2 = vibrate) and **else if**.`},quiz:[{q:`Which component is best for playing a full song that the user can stop?`,options:[`Sound`,`Player`,`Notifier`,`Label`],answer:1,explain:`Player is built for longer audio and has Start, Stop, and Loop. Sound is for short effects.`},{q:`muted starts as false. The user taps MuteButton twice, then taps Button1 (which only plays "if not get global muted"). Does the sound play?`,options:[`Yes`,`No`,`Only the first time`,`The app shows an error`],answer:0,explain:`false → true → false. muted is false again, so "not muted" is true and the sound plays.`},{q:`You tap a button and nothing plays. The Source is "Drum.mp3" but the uploaded file is "drum.mp3". What happened?`,options:[`The phone is broken`,`File names must match exactly, including capital letters`,`Sound can only play .wav files`,`You need a Player instead`],answer:1,explain:`App Inventor looks for the exact file name. "Drum" and "drum" are different.`},{q:`Why do we check "if not get global muted" inside each sound button?`,options:[`So the button only plays when the app is not in mute mode`,`To make the sound louder`,`To upload the file`,`Because Sound requires an if block`],answer:0,explain:`The if block makes the same tap act differently depending on the mute state.`}],checks:[{kind:`anyComponent`,types:[`Sound`,`Player`],label:`Has a Sound or Player component`},{kind:`component`,type:`Button`,min:3,label:`Has at least 3 Buttons`},{kind:`block`,type:`global_declaration`,label:`Has a global variable (mute mode)`},{kind:`block`,type:`controls_if`,label:`Uses an if block`},{kind:`eventCount`,min:4,label:`Has at least 4 event handlers`},{kind:`anyBlock`,types:[`logic_negate`,`logic_boolean`],label:`Uses true/false (boolean) logic`}],teacherNotes:`Finding media takes longer than coding. Pre-approve a few free libraries or let students record clips with a phone voice recorder. Large files (>5 MB) slow the Companion and can fail to load. On some school Chromebooks audio is muted at the system level. The toggle with "not" is a key pattern; ask students to explain it out loud. Fair use of found sounds is a good discussion here (see the Talk it over prompt).`},{id:`mini-convert`,title:`Unit Converter`,subtitle:`A handy tool that does the math for you`,icon:`📏`,track:`mini`,concepts:[`User input`,`Math blocks`,`Input validation`,`If / else`],periods:2,xp:{quiz:40,build:120,bonus:40},project:{name:`Unit Converter`,description:`Type a number, tap a button, and convert it, for example inches ↔ centimeters. The app shows a helpful message instead of crashing on bad input.`},objectives:[`Read a number the user types into a TextBox`,`Use math blocks to multiply and divide`,`Check input before doing math (empty, not a number)`,`Store the conversion factor and unit names in global variables so they are easy to change`],intro:`Tool companies build apps people use every day to get something done. A **unit converter** takes input, does a calculation, and shows a result. A good tool **never crashes on bad input**. Today you will check what the user typed with an **if** block before you trust it.`,vocab:[{term:`Input`,def:`Information the user gives the app, like a number typed in a TextBox.`},{term:`Output`,def:`What the app shows back, like the converted answer.`},{term:`Validation`,def:`Checking that input is OK before using it.`},{term:`Constant`,def:`A value that does not change while the app runs, like 2.54 cm per inch.`}],steps:[{title:`Pick your conversion`,body:`**Your choice:** with your partner, pick ONE conversion your users would want. Write down its factor:

- inches → centimeters: **2.54**
- miles → kilometers: **1.609**
- pounds → kilograms: **0.4536**
- cups → milliliters: **236.6**

To go forward you **multiply** by the factor. To go back you **divide**.`,simple:`Pick one conversion from the list. Write down its number (the factor). Forward = multiply. Back = divide.`,frames:[`Our app converts ___ to ___. The factor is ___.`]},{title:`Design the tool`,editor:`designer`,body:"Start a project called `UnitConverter`. Add:\n\n- A **TextBox** `InputBox`. Check **NumbersOnly** and set the Hint to `Enter a number`.\n- A **HorizontalArrangement** with two **Buttons**: `ConvertButton` and `BackButton`. Set their Text to your units, like `in → cm` and `cm → in`.\n- A **Label** `ResultLabel` with a large font.\n- A **Notifier** for error messages.",simple:`Make a project called UnitConverter. Add a number box, two buttons side by side, a big result label, and a Notifier.`,check:`Test now: the two buttons sit side by side and show your units.`,newBlocks:[{name:`HorizontalArrangement`,where:`Palette → Layout`,what:`Puts the parts inside it side by side.`},{name:`Notifier`,where:`Palette → User Interface`,what:`Shows pop-up messages.`}]},{title:`Store your factor and units (fill the blanks)`,editor:`blocks`,body:'Store your numbers once, in global variables. If you ever need to fix one, you change one block. **Fill the blanks** with YOUR factor and YOUR two unit names (for example `2.54`, `"in"`, `"cm"`).',simple:`Make three variables: your factor, the "from" unit name, and the "to" unit name.`,blocks:[`initialize global factor to: ___`,`initialize global fromUnit to: ___`,`initialize global toUnit to: ___`]},{title:`Convert, but check first`,editor:`blocks`,body:"Check the box before doing math: is it empty? Is it not a number? Only then multiply and show the result.\n\n**format as decimal** (Math drawer) rounds the answer to 2 places, so `25.4000001` shows as `25.40`.",simple:`If the box is empty or not a number, show a message. Otherwise, multiply by the factor and show the answer.`,blocks:[`when ConvertButton.Click do`,`  if is empty(InputBox.Text)`,`    call Notifier1.ShowAlert(notice: "Type a number first!")`,`  else if not(is number?(InputBox.Text))`,`    call Notifier1.ShowAlert(notice: "Numbers only, please.")`,`  else`,`    set ResultLabel.Text to: join(format as decimal(InputBox.Text × get global factor, 2), " ", get global toUnit)`],check:`Test now: type 10 and tap Convert. For inches → cm you see "25.40 cm".`,stuck:[`The format as decimal block needs two things: the number, and how many places (2).`],newBlocks:[{name:`format as decimal`,where:`Math drawer`,what:`Shows a number with a set number of decimal places.`},{name:`is number?`,where:`Math drawer`,what:`True when a text can be used as a number.`}]},{title:`Go the other direction (words only)`,editor:`blocks`,day:2,body:"Build `when BackButton.Click` yourself. It does the same checks, but **divides** by `factor` and shows `fromUnit` at the end.",simple:`Make the Back button. Same checks, but divide instead of multiply, and show the "from" unit.`,check:`Test now: type 25.4 and tap Back. For cm → in you see "10.00 in".`,stuck:[`Duplicate the Convert handler, change the button name, the × block to ÷, and toUnit to fromUnit.`]},{title:`Try to break it, then submit`,editor:`phone`,body:"Good tool-makers try to break their own tools. Test an empty box, `0`, a decimal like `2.5`, a very big number, and (on keyboards that allow it) a single `.`. Does anything crash or look wrong? Fix it, do the **Remix**, export the `.aia`, and submit it.",simple:`Try bad inputs to break your app. Fix any problems. Do the Remix and submit.`,frames:[`When we typed ___, the app ___. We fixed it by ___.`]}],remix:{title:`Remix: History`,spec:`Add a HistoryLabel. Every time a conversion works, add a new line to it like "10 in = 25.40 cm", so the user can see all their past conversions.`,hints:[`Join the OLD HistoryLabel.Text with the new line.`,`Put "\\n" at the end of each new line so the next one starts on a new line.`,`Build the new line with join: the input, the from unit, " = ", the answer, the to unit.`]},challenge:{title:`Bonus: Temperature mode`,body:'Add °F → °C buttons. The formula is `C = (F − 32) × 5 ÷ 9`. Build it from the inside out: first `F − 32`, then put that inside `× 5`, then put that inside `÷ 9`. Then add a check: if the °C answer is below 0, also show "Brr! Below freezing."'},quiz:[{q:`Why check "is empty" before doing math?`,options:[`To make the app faster`,`Doing math on empty text causes an error, so we show a message instead`,`Because TextBoxes are always empty`,`To change the keyboard`],answer:1,explain:`Checking input stops bad input from crashing the app and helps the user fix the problem.`},{q:`factor is 2.54 and toUnit is "cm". The user types 4 and taps Convert. What does ResultLabel show?`,options:[`"4 cm"`,`"10.16 cm"`,`"1.57 cm"`,`"6.54 cm"`],answer:1,explain:`4 × 2.54 = 10.16, formatted with 2 decimal places, then " cm".`},{q:`Why store 2.54 in a global variable called factor?`,options:[`Numbers cannot be typed into math blocks`,`It is easier to read, and you only change it in one place`,`Global variables do math faster`,`App Inventor requires it`],answer:1,explain:`A named value makes code readable and means you only change one block.`},{q:`To go from centimeters back to inches you should:`,options:[`Multiply by 2.54`,`Divide by 2.54`,`Add 2.54`,`Subtract 2.54`],answer:1,explain:`Going back means doing the opposite: divide instead of multiply.`}],checks:[{kind:`component`,type:`TextBox`,label:`Has a TextBox for input`},{kind:`anyBlock`,types:[`math_multiply`,`math_division`],label:`Uses multiply or divide`},{kind:`block`,type:`text_isEmpty`,label:`Checks input with "is empty"`},{kind:`block`,type:`controls_if`,label:`Uses an if block`},{kind:`event`,component:`Button`,event:`Click`,label:`Uses a Button.Click event`},{kind:`block`,type:`global_declaration`,label:`Stores the factor in a global variable`}],teacherNotes:`The generic names (ConvertButton, BackButton, factor, fromUnit, toUnit) let each company keep the conversion they chose. App Inventor converts numeric text in math blocks, but empty text throws a runtime error ("The operation * cannot accept the arguments: [], [2.54]"). Let a few students hit that error on purpose before adding validation. NumbersOnly still allows an empty box and, on some keyboards, a lone "-" or "."; the "is number?" check handles those. format as decimal is also taught in core Procedures, so nothing later depends on this lesson.`}],Ln=[{id:`games-sprites`,title:`Canvas & Sprites`,subtitle:`Make characters you can tap`,icon:`🐞`,track:`games`,concepts:[`Canvas coordinates`,`ImageSprite`,`Random numbers`,`Touch events`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Bug Tap`,description:`A bug appears on the screen. Tap it to score a point, and it jumps to a random new spot. How fast can you get to 20?`},objectives:[`Use a Canvas as a game board and understand its x/y coordinate system`,`Add an ImageSprite and respond to its Touched event`,`Move a sprite to a random position that always stays on screen`,`Track and display a score, and end the game with a win condition`],intro:`Welcome to the **Game Studio**! Almost every 2D game has the same parts: a **board** (the Canvas) and **characters** (sprites) that move on it. Every spot on the board has an **x** (how far from the left) and a **y** (how far from the top). Today you build a tapping game and learn the math that keeps your character on the screen.`,vocab:[{term:`Canvas`,def:`A drawing area that holds sprites. The top-left corner is x = 0, y = 0.`},{term:`Sprite`,def:`A character or object in a game that can move and notice touches and crashes.`},{term:`Coordinates`,def:`An (x, y) pair that says where something is. y gets BIGGER as you go DOWN.`},{term:`Random integer`,def:`A whole number picked by chance between two limits.`}],steps:[{title:`Set up the game board`,editor:`designer`,body:"Start a project called `BugTap`. Add a **Label** named `ScoreLabel` (Text `Score: 0`) at the top. From the **Drawing and Animation** drawer add a **Canvas**. Set its **Width** and **Height** to *Fill parent* so it fills the rest of the screen. Give it a **BackgroundColor**, or upload a **BackgroundImage** (grass, a kitchen floor…).",simple:`Make a project called BugTap. Add a Label for the score. Add a Canvas and make it fill the screen.`,check:`Test now: your phone shows the score label and a colored game board under it.`,newBlocks:[{name:`Canvas`,where:`Palette → Drawing and Animation`,what:`A game board where sprites can move.`}],stuck:[`The Canvas is tiny? Set BOTH Width and Height to Fill parent.`]},{title:`Add your sprite`,editor:`designer`,body:"Upload a small picture of a bug (or a coin, or a balloon). A PNG with a see-through background looks best. **Crop it tightly**: empty space around the picture still counts as part of the sprite. Drag an **ImageSprite** *onto the Canvas*. Set its **Picture** to your image and its **Width** and **Height** to `60` pixels. Rename it `Bug`.",simple:`Upload a small bug picture. Put an ImageSprite on the Canvas. Use your picture and make it 60 by 60. Name it Bug.`,check:`Test now: you see your bug on the board on your phone.`,newBlocks:[{name:`ImageSprite`,where:`Palette → Drawing and Animation`,what:`A picture that can move and be tapped. It only works inside a Canvas.`}],stuck:[`The sprite will not drop? It must go INSIDE the Canvas, not on the screen around it.`,`Picture looks huge? Set Width and Height to 60 pixels, not Automatic.`]},{title:`Understand the coordinates`,body:"On a Canvas, `x = 0, y = 0` is the **top-left** corner. x grows to the right. y grows **downward**, the opposite of math class! A sprite's X and Y are the spot of its *top-left corner*.\n\nTo keep the bug fully on screen, X must stay between `0` and `Canvas1.Width − Bug.Width`. Y works the same way with Height. Sketch a phone on paper with your partner and label the four corners before you code.",simple:`The top-left corner is 0, 0. y gets bigger going DOWN. To keep the bug on screen, X can be from 0 up to (Canvas width minus bug width).`,stuck:[`Think of reading a page: you start at the top-left and go right and down.`]},{title:`Score when the bug is tapped`,editor:`blocks`,body:"Make a global variable `score`. When the bug is touched, add 1 and show the new score. Fill in the two blanks yourself: what should score start at, and what text goes before the number? The Touched event also gives you `x` and `y` (where the finger was). You do not need them today.",simple:`Make a score variable. When the bug is tapped, add 1 to the score and show it. Fill in the blanks.`,blocks:[`initialize global score to ___`,`when Bug.Touched x y do`,`  set global score to get global score + 1`,`  set ScoreLabel.Text to join ___ get global score`],check:`Test now: tap the bug. The label shows Score: 1, then Score: 2…`,stuck:[`Can't find "get global score"? Hover over the word "score" in the initialize block, then drag the "get" out.`,`Score shows "Score:1" with no space? Put a space inside the quotes: "Score: ".`]},{title:`Jump to a random spot`,editor:`blocks`,day:2,body:"Still inside `Bug.Touched`, call **MoveTo** with random numbers. The largest x keeps the whole bug on screen. Fill in the y blank yourself: it works like x, but with Height.",simple:`Inside Bug.Touched, move the bug to a random place. Use the same math for y as for x, but use Height.`,blocks:[`when Bug.Touched x y do`,`  set global score to get global score + 1`,`  set ScoreLabel.Text to join "Score: " get global score`,`  call Bug.MoveTo`,`    x: random integer from 0 to Canvas1.Width - Bug.Width`,`    y: random integer from 0 to ___`],check:`Test now: every tap makes the bug jump. Tap 20 times: it is never cut off at an edge.`,newBlocks:[{name:`random integer from … to …`,where:`Math drawer`,what:`Picks a whole number by chance between the two limits.`}],stuck:[`Bug goes off the bottom? Check that the y blank uses Canvas1.Height − Bug.Height, not Width.`,`Bug stuck in the top-left corner? Canvas1.Width can be −1 before the screen is drawn. Only move the bug inside Touched, not in Screen1.Initialize.`,`The minus block is in the Math drawer. Snap Canvas1.Width into the left side and Bug.Width into the right.`]},{title:`Win condition, test, submit`,editor:`blocks`,body:'Put an **if** at the *bottom* of `Bug.Touched`, after the score goes up. When `score = 20`, show "You win!" and hide the bug by setting its **Visible** to `false`. Then play the whole game on your phone. Export the `.aia` and submit it.',simple:`At the bottom of Bug.Touched, add an if. When the score is 20, show "You win!" and hide the bug.`,blocks:[`when Bug.Touched x y do`,`  …the score and MoveTo blocks from before…`,`  if get global score = 20`,`    set ScoreLabel.Text to "You win!"`,`    set Bug.Visible to false`],check:`Test now: at 20 taps the bug disappears and the label says You win!`,newBlocks:[{name:`Visible`,where:`click the component → set Bug.Visible to`,what:`false hides a component; true shows it again.`}],stuck:[`The if must be INSIDE Bug.Touched. A loose if block never runs.`,`Nothing happens at 20? Use the = block from the Math drawer, and make sure the if is below the score change.`]}],remix:{title:`Decoy bee`,spec:`Add a second sprite: a bee. It also jumps to a random spot whenever it is tapped. Tapping the bee takes away 2 points, but the score can never go below 0. The bee must always stay fully on screen.`,hints:[`Copy the Bug.Touched blocks (right-click → Duplicate) and change them for the bee.`,`Subtract 2, then use an if: if score < 0, set score to 0.`,`For on-screen math, use Bee.Width and Bee.Height, not the bug's.`]},devices:[{need:`No phone today`,fallback:`Use Connect → Emulator if your teacher set it up. Click the bug with the mouse.`},{need:`iPhone`,fallback:`Canvas and sprites work in the iOS Companion. Everything in this lesson works.`}],challenge:{title:`Bonus: Beat the clock`,body:`Add a **Clock** that counts down 30 seconds in a Label. When time runs out, hide the bug and show the final score. Extra bonus: make the bug jump on its own every 2 seconds, even if nobody taps it.`},quiz:[{q:`On an App Inventor Canvas, where is the point x = 0, y = 0?`,options:[`The center`,`The bottom-left corner`,`The top-left corner`,`The bottom-right corner`],answer:2,explain:`The origin is the top-left. x grows to the right and y grows downward.`},{q:`The Canvas is 300 wide and the bug is 60 wide. What is the largest X that keeps the whole bug on screen?`,options:[`300`,`360`,`240`,`60`],answer:2,explain:`X is the bug's left edge. 300 − 60 = 240, so the right edge lands exactly on the side of the Canvas.`},{q:`Where must an ImageSprite be placed in the Designer?`,options:[`Anywhere on Screen1`,`Inside a Canvas`,`Inside a HorizontalArrangement`,`In the Media panel`],answer:1,explain:`Sprites live on a Canvas. That is what lets them move, be touched, and crash into things.`},{q:`The score is 19. The player taps the bug once. What does the label show after Bug.Touched runs?`,options:[`Score: 19`,`Score: 20`,`You win!`,`Nothing changes`],answer:2,explain:`The score becomes 20 first, then the if at the bottom is true, so the label is changed to "You win!".`}],checks:[{kind:`component`,type:`Canvas`,label:`Has a Canvas`},{kind:`component`,type:`ImageSprite`,label:`Has an ImageSprite`},{kind:`event`,component:`ImageSprite`,event:`Touched`,label:`Uses an ImageSprite.Touched event`},{kind:`method`,method:`MoveTo`,label:`Calls MoveTo`},{kind:`block`,type:`math_random_int`,label:`Uses a random integer`},{kind:`block`,type:`global_declaration`,label:`Tracks the score in a global variable`}],teacherNotes:`Day 1 ends after the scoring step; Day 2 starts at "Jump to a random spot". The upside-down y-axis trips up nearly everyone: sketch a phone on the board with coordinates in each corner. Students now fill in two blanks (start value, label text, y-bound); circulate during the y-bound blank because it is the first time they write the math themselves. The remix (decoy bee) is the "you do": no blocks given, and it reuses the clamp-at-zero idea from conditionals. Encourage original sprite art rather than copyrighted characters.`},{id:`games-motion`,title:`Motion & Collisions`,subtitle:`Things that move, bounce, and crash`,icon:`☄️`,track:`games`,concepts:[`Heading & Speed`,`Edge detection`,`Collision detection`,`Drag controls`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Dodge It`,description:`Balls bounce around the screen. Drag your player to dodge them. If one hits you, the game is over.`},objectives:[`Make sprites move on their own with Heading, Speed, and Interval`,`Bounce off walls with the EdgeReached event and the Bounce method`,`Detect when two sprites touch with CollidedWith`,`Move the player by dragging, and keep the player on screen`],intro:`Last time your sprite only moved when you tapped it. Real games have things that **move on their own**. Give a sprite a **direction** (Heading) and a **speed**, and it moves across the Canvas by itself. Then you need to know when it hits a wall or *another sprite*. This is called **collision detection**, and almost every action game uses it.`,vocab:[{term:`Heading`,def:`The direction a sprite moves, in degrees: 0 = right, 90 = up, 180 = left, 270 = down.`},{term:`Speed`,def:`How many pixels a sprite moves each step.`},{term:`Interval`,def:`How many milliseconds between steps. Smaller = moves more often.`},{term:`Collision`,def:`When two sprites overlap on the Canvas.`}],steps:[{title:`Board, player, and enemies`,editor:`designer`,body:"Start a project called `DodgeIt`. Add a **Label** named `StatusLabel`, then a **Canvas** (Fill parent, both ways). On the Canvas place:\n\n- An **ImageSprite** named `Player` (your hero, about 50×50, cropped tightly)\n- Two **Ball** components named `Enemy1` and `Enemy2`. Set **Radius** to `15` and pick a bright **PaintColor**. Start them near the middle, not touching an edge.",simple:`Make a project called DodgeIt. Add a label and a Canvas. On the Canvas, add one ImageSprite called Player and two Balls called Enemy1 and Enemy2.`,check:`Test now: you see the player and two balls on the board.`,newBlocks:[{name:`Ball`,where:`Palette → Drawing and Animation`,what:`A round sprite. You set its size with Radius and its color with PaintColor.`}]},{title:`Set the enemies in motion`,editor:`designer`,body:"Select `Enemy1`. Set **Speed** to `8`, **Interval** to `50`, and **Heading** to `45` (up and to the right). Give `Enemy2` a different Heading, like `200`. Watch your phone: they move! But they get stuck at the edge. You will fix that next.",simple:`Give Enemy1 Speed 8, Interval 50 and Heading 45. Give Enemy2 a different Heading. They start moving.`,check:`Test now: both balls move in different directions and stop at an edge.`,stuck:[`Heading 90 goes UP even though y grows down. Headings use compass angles: 0 right, 90 up, 180 left, 270 down.`,`Interval is the time between steps for THIS sprite. It is not the Clock's TimerInterval.`]},{title:`Bounce off the walls`,editor:`blocks`,body:`When a ball hits the edge, **EdgeReached** tells you *which* edge. Pass that edge into **Bounce**, which turns the ball around for you. Here is Enemy1.

**Now you:** build the same handler for \`Enemy2\` on your own. No blocks given!`,simple:`When Enemy1 hits an edge, bounce it. Then make the same blocks for Enemy2 by yourself.`,blocks:[`when Enemy1.EdgeReached edge do`,`  call Enemy1.Bounce`,`    edge: get edge`],check:`Test now: both balls bounce around the board and never get stuck.`,newBlocks:[{name:`Bounce`,where:`click Enemy1 → call Enemy1.Bounce`,what:`Turns the ball so it bounces off the edge it hit.`}],stuck:[`Only Enemy1 bounces? You need a second EdgeReached block for Enemy2.`,`Can't find "get edge"? Hover over the word edge on the event block.`,`A ball shakes in a corner? It started touching the edge. Move it toward the middle in the Designer.`]},{title:`Drag the player`,editor:`blocks`,body:"**Dragged** runs again and again while a finger slides on the player. It gives you the finger's `currentX` and `currentY`. Subtract half the player's size so your finger is in the middle of the sprite. Fill in the y blank yourself. Note: Dragged only works if your finger *starts on the player*.",simple:`When you drag the player, move it to your finger. Subtract half its size so your finger is in the middle. Fill in the blank for y.`,blocks:[`when Player.Dragged startX startY prevX prevY currentX currentY do`,`  call Player.MoveTo`,`    x: get currentX - Player.Width / 2`,`    y: ___`],check:`Test now: put your finger on the player and slide. It follows your finger.`,stuck:[`Player does not move? Start the drag ON the player, not on empty Canvas.`,`Player jumps away from your finger? Check the y blank: currentY − Player.Height / 2.`]},{title:`Keep the player on screen`,editor:`blocks`,body:'Right now you can drag the player half off the edge. **No blocks given:** after the MoveTo, use **if** blocks so that if `Player.X` is bigger than `Canvas1.Width − Player.Width`, you set `Player.X` to that number. Do the same for Y with Height. This is the same "stay on screen" math as Bug Tap.',simple:`Stop the player from leaving the screen. If Player.X is too big, set it back to the biggest allowed number. Do the same for Y.`,check:`Test now: drag the player hard to the right and bottom edges. It stops at the edge.`,stuck:[`The largest allowed X is Canvas1.Width − Player.Width, like Bug Tap.`,`The ifs go INSIDE Player.Dragged, below the MoveTo.`,`Use the > block from the Math drawer.`]},{title:`Detect the crash`,editor:`blocks`,day:2,body:"**CollidedWith** runs when the player overlaps another sprite. `other` tells you which one. To stop the game, set each enemy's **Enabled** to `false` (that freezes it). The first line is given. **You** write the rest: a status message and freezing both enemies.",simple:`When the player hits a ball, show "Game over" and freeze both balls by setting Enabled to false.`,blocks:[`when Player.CollidedWith other do`,`  set StatusLabel.Text to "💥 Game over!"`,`  ___ (freeze Enemy1)`,`  ___ (freeze Enemy2)`],check:`Test now: let a ball hit you. Both balls stop and the label says Game over.`,stuck:[`"I didn't touch it!" Empty space around your picture still counts. Crop the image tightly.`,`Only one ball stops? You need two set …Enabled blocks, one for each enemy.`]},{title:`Playtest and submit`,editor:`phone`,body:"Play several rounds. Too easy? Raise Speed. Too hard? Lower it or make the balls smaller. Finding the right challenge is called **game balancing**. Write one sentence in your notes about what you changed. Export your `.aia` and submit it.",simple:`Play many times. Make it not too easy and not too hard. Write what you changed. Submit.`,frames:[`At first the game was too ___ because ___.`,`We changed ___ from ___ to ___, and now ___.`]}],remix:{title:`Enemy number 3`,spec:`Add a third enemy that is smaller and faster than the others and starts from a different place. It must bounce off walls and freeze when the game ends, like the others.`,hints:[`In the Designer, copy the settings of Enemy1 but change Radius, Speed and Heading.`,`It needs its own EdgeReached handler.`,`Add one more set …Enabled to false inside Player.CollidedWith.`]},devices:[{need:`No phone today`,fallback:`Use the emulator and drag with the mouse. It can feel slow; that is the emulator, not your code.`},{need:`iPhone`,fallback:`Dragging and collisions work in the iOS Companion.`}],challenge:{title:`Bonus: Restart and survive`,body:`Add a **Start** button that re-enables the enemies and moves them back near the top with MoveTo (not into a corner, or they can get stuck). Add a **Clock** that counts how many seconds the player survives, and show it when the game ends.`},quiz:[{q:`A sprite has Heading 180. Which way does it move?`,options:[`Right`,`Up`,`Left`,`Down`],answer:2,explain:`0 is right, 90 is up, 180 is left, 270 is down, like a compass turned on its side.`},{q:`What does "call Enemy1.Bounce edge: get edge" do inside EdgeReached?`,options:[`Deletes the ball`,`Turns the ball so it bounces off the edge it hit`,`Moves the ball to the center`,`Makes the ball bigger`],answer:1,explain:`Bounce uses the edge from the event to change the heading, like a real bounce.`},{q:`The Canvas is 320 wide and the player is 50 wide. You drag the player so Player.X becomes 300. What does your keep-on-screen if set Player.X to?`,options:[`300`,`320`,`270`,`50`],answer:2,explain:`300 is bigger than 320 − 50 = 270, so the if sets X to 270.`},{q:`You want enemies to move faster. Which change does NOT help?`,options:[`Increase Speed`,`Decrease Interval`,`Increase Interval`,`Both A and B help`],answer:2,explain:`A bigger Interval means more time between steps, so the sprite moves slower.`}],checks:[{kind:`component`,type:`Canvas`,label:`Has a Canvas`},{kind:`anyComponent`,types:[`Ball`,`ImageSprite`],label:`Has moving sprites (Ball or ImageSprite)`},{kind:`method`,method:`Bounce`,label:`Calls Bounce`},{kind:`event`,component:`Ball`,event:`EdgeReached`,label:`Uses a Ball.EdgeReached event`},{kind:`event`,component:`ImageSprite`,event:`CollidedWith`,label:`Uses an ImageSprite.CollidedWith event`},{kind:`event`,component:`ImageSprite`,event:`Dragged`,label:`Uses an ImageSprite.Dragged event`}],teacherNotes:`Day 2 starts at "Detect the crash". Three handlers are now words-only or blanks (Enemy2 bounce, keep-on-screen, freeze both enemies); expect the keep-on-screen step to need a quick whiteboard reminder of the Bug Tap math. Heading uses math-class angles (90 = up) even though y grows downward; say this out loud. Collisions use the image box, so padding causes "I didn't touch it!" complaints. On slow phones, Interval below ~30 ms can stutter. A ball that starts touching an edge can shake in place; start balls away from edges.`},{id:`games-state`,title:`Score, Lives & Levels`,subtitle:`Game state, difficulty, and a saved high score`,icon:`❤️`,track:`games`,concepts:[`Game state`,`Procedures`,`Clock timers`,`Saving data (TinyDB)`],periods:3,xp:{quiz:50,build:150,bonus:50},project:{name:`Dodge It 2.0`,description:`Upgrade Dodge It with 3 lives, a score that goes up while you survive, levels that speed up the enemies, and a high score that is saved even after you close the app.`},objectives:[`Keep track of game state with several global variables (score, lives, level)`,`Organize code into resetGame and gameOver procedures`,`Use a Clock to raise the score and difficulty over time`,`Save and load a high score with TinyDB`],intro:`A game that ends on the first hit gets boring fast. Real games have **lives**, **levels**, and a **high score** to beat. Now your app has to remember many values at once. That is called **game state**. To keep your code tidy, you will put the big moments, *start a game* and *end a game*, into **procedures**. And with **TinyDB**, your high score stays saved even when the app is closed.`,vocab:[{term:`Game state`,def:`All the values that describe the game right now: score, lives, level.`},{term:`Game loop`,def:`Code that runs again and again (here, Clock1.Timer) to update the game.`},{term:`TinyDB`,def:`A component that saves values on the phone so they are still there next time.`},{term:`Tag`,def:`The name a value is saved under in TinyDB, like "dodgeHighScore".`}],steps:[{title:`Plan the state`,body:"Open your **Dodge It** project. Use **Projects → Save project as…** and name the copy `DodgeIt2`, so your old game stays safe. Before coding, list on paper every value the game must remember: `score`, `lives`, `level`. What should each one be at the start of a new game?",simple:`Make a copy of Dodge It called DodgeIt2. On paper, list what the game must remember: score, lives, level. Write the starting number for each.`,frames:[`The game must remember ___. At the start it is ___.`],newBlocks:[{name:`Save project as…`,where:`Projects menu`,what:`Makes a copy of your project with a new name.`}]},{title:`Add components and globals`,editor:`designer`,body:"Add a **Clock** (Sensors drawer). Set **TimerInterval** to `1000` (1 second) and **uncheck TimerEnabled**, so it waits for Start. Also uncheck **Enabled** on both enemies, so nothing moves until Start. Add a **TinyDB** (Storage drawer), Labels `ScoreLabel`, `LivesLabel`, `HighLabel`, and a **Button** `StartButton`. Then make these globals:",simple:`Add a Clock, a TinyDB, three labels and a Start button. Turn OFF the Clock and the enemies in the Designer. Make three global variables.`,blocks:[`initialize global score to 0`,`initialize global lives to 3`,`initialize global level to 1`],check:`Test now: when the app opens, nothing moves until you press Start (Start does nothing yet).`,newBlocks:[{name:`TinyDB`,where:`Palette → Storage`,what:`Saves values on the phone that stay after the app closes.`}],stuck:[`TimerInterval is the Clock's time between Timer events. Interval on a Ball is a different thing.`,`Score ticking before Start? Uncheck TimerEnabled on Clock1 in the Designer.`]},{title:`The resetGame procedure`,editor:`blocks`,body:"From the **Procedures** drawer drag out `to procedure do` and name it `resetGame`. Everything a fresh game needs goes here: reset the numbers and labels, put the player and BOTH enemies back in safe spots (not corners), and turn everything on. The labels are blanks for you.",simple:`Make a procedure called resetGame. It sets everything back to the start: numbers, labels, player, both enemies. Then it turns the Clock on.`,blocks:[`to resetGame do`,`  set global score to 0`,`  set global lives to 3`,`  set global level to 1`,`  set ScoreLabel.Text to ___`,`  set LivesLabel.Text to ___`,`  set StatusLabel.Text to ""`,`  call Player.MoveTo x: 130 y: 400`,`  call Enemy1.MoveTo x: 40 y: 40`,`  call Enemy2.MoveTo x: 200 y: 60`,`  set Enemy1.Speed to 5`,`  set Enemy2.Speed to 5`,`  set Enemy1.Enabled to true`,`  set Enemy2.Enabled to true`,`  set Clock1.TimerEnabled to true`],stuck:[`Is your Canvas smaller? Pick MoveTo numbers that fit your screen. Keep enemies away from the player and the corners.`,`The empty "" text block clears the label.`]},{title:`Start button`,editor:`blocks`,body:"**No blocks given:** when `StartButton` is clicked, call `resetGame`. You can find the call block in the Procedures drawer after you make the procedure.",simple:`When Start is clicked, call resetGame. Build it yourself.`,check:`Test now: press Start. The enemies move, the score starts at 0, and lives show 3.`,stuck:[`The "call resetGame" block appears in the Procedures drawer only after you name the procedure.`]},{title:`Lose a life (not the whole game)`,editor:`blocks`,day:2,body:"Change `Player.CollidedWith`. Take away one life. Then move away **the enemy that hit you**: compare `other` with `Enemy1` using the **=** block. If the enemy stays on top of you, you lose more lives. Use `≤ 0`, not `= 0`: if two hits happen at once, lives could skip past 0.",simple:`When you get hit, lose one life. Move the enemy that hit you away. If lives are 0 or less, call gameOver.`,blocks:[`when Player.CollidedWith other do`,`  set global lives to get global lives - 1`,`  set LivesLabel.Text to join "Lives: " get global lives`,`  if other = Enemy1`,`    call Enemy1.MoveTo x: 40 y: 40`,`  else`,`    call Enemy2.MoveTo x: 200 y: 60`,`  if get global lives ≤ ___`,`    call gameOver`],check:`Test now (after the next steps): one hit takes away exactly one life.`,newBlocks:[{name:`other = Enemy1`,where:`Logic drawer (=) + click Enemy1 at the bottom of its blocks`,what:`Checks which sprite you crashed into.`}],stuck:[`Lose all 3 lives at once? The enemy is still on top of you. Make sure the right enemy moves away.`,`The Enemy1 block for the compare is the plain green "Enemy1" block at the very bottom of Enemy1's list.`]},{title:`The game loop: score and levels`,editor:`blocks`,body:"Every second you survive is 1 point. Every 10 points is a new level. The Math **modulo** block gives the remainder: `modulo of score ÷ 10 = 0` is true at 10, 20, 30… **You** fill the inside of the if: add 1 to `level`, and add 2 to BOTH enemies' Speed.",simple:`Each second, add 1 point. Every 10 points, go up one level and make both enemies faster.`,blocks:[`when Clock1.Timer do`,`  set global score to get global score + 1`,`  set ScoreLabel.Text to join "Score: " get global score`,`  if modulo of get global score ÷ 10 = 0`,`    ___ (level up)`,`    ___ (speed up both enemies)`],check:`Test now: the score goes up each second, and at 10 the balls get faster.`,newBlocks:[{name:`modulo of … ÷ …`,where:`Math drawer`,what:`The remainder after dividing. 20 ÷ 10 has remainder 0.`}],stuck:[`Speed up: set Enemy1.Speed to Enemy1.Speed + 2. Do the same for Enemy2.`]},{title:`gameOver and the saved high score`,editor:`blocks`,day:3,body:'TinyDB **GetValue** reads a saved value. If nothing is saved yet, it gives the `valueIfTagNotThere` number. **StoreValue** saves a value. In `gameOver`, stop everything, then save the score if it beats the old best. Use a tag that belongs to this game, like `"dodgeHighScore"`.',simple:`gameOver stops the game. It reads the old best score. If your score is bigger, it saves your score as the new best.`,blocks:[`to gameOver do`,`  set Clock1.TimerEnabled to false`,`  set Enemy1.Enabled to false`,`  set Enemy2.Enabled to false`,`  if get global score > call TinyDB1.GetValue tag: "dodgeHighScore" valueIfTagNotThere: 0`,`    call TinyDB1.StoreValue tag: "dodgeHighScore" valueToStore: get global score`,`    set StatusLabel.Text to "🏆 New high score!"`,`  set HighLabel.Text to join "Best: " call TinyDB1.GetValue tag: "dodgeHighScore" valueIfTagNotThere: 0`],newBlocks:[{name:`TinyDB1.StoreValue / GetValue`,where:`click TinyDB1`,what:`StoreValue saves a value under a tag. GetValue reads it back.`}],stuck:[`Spell the tag exactly the same every time. "dodgeHighScore" and "DodgeHighScore" are different.`,`Strange old high score? Other Companion apps may use the same tag. Use a unique tag.`]},{title:`Show the best score when the app opens`,editor:`blocks`,body:'**No blocks given:** in `Screen1.Initialize`, set `HighLabel.Text` to "Best: " joined with the saved high score from TinyDB (use 0 if nothing is saved).',simple:`When the app opens, show the saved best score. Build it yourself.`,check:`Test now: play, set a high score, close the Companion and reconnect. The best score is still there.`,stuck:[`You can copy the last line of gameOver into Screen1.Initialize.`]},{title:`Test the whole loop and submit`,editor:`phone`,body:"Test a full cycle: Start, lose all lives, see game over, press Start again. Does everything reset, including both enemies and the player? Fix anything that does not. Export the `.aia` and submit.",simple:`Play a whole game twice in a row. Everything must reset when you press Start. Then submit.`,check:`Done when: a second game starts with score 0, 3 lives, and slow enemies.`}],remix:{title:`Pause button`,spec:`Add a Pause button. Tapping it once freezes the game: the Clock and both enemies stop, and the button text changes to "Resume". Tapping it again starts everything again and changes the text back to "Pause".`,hints:[`Make a global variable paused that starts as false.`,`In PauseButton.Click, use if / else on paused. Remember to flip paused to the other value.`,`Freeze and unfreeze with set …Enabled and set Clock1.TimerEnabled.`]},devices:[{need:`No phone today`,fallback:`The emulator works. TinyDB saves on the emulator too.`},{need:`iPhone`,fallback:`Everything in this lesson works in the iOS Companion.`}],challenge:{title:`Bonus: Power-ups`,body:`Add a heart sprite that appears every 15 seconds at a random spot (use Visible to show and hide it). Touching it gives +1 life (max 5). Put the "spawn a heart" code in its own procedure, and use **if** to keep lives at 5 or less.`},quiz:[{q:`Why put the start-of-game code in a resetGame procedure?`,options:[`Procedures run faster than events`,`It keeps the code in one place, so Start (or Play Again) can call it`,`TinyDB requires it`,`Global variables only work inside procedures`],answer:1,explain:`Procedures let you name a group of blocks and reuse it without copying.`},{q:`Lives is 1. Enemy2 hits the player. What happens, step by step?`,options:[`Lives becomes 0, Enemy1 moves, nothing else`,`Lives becomes 0, Enemy2 moves away, then gameOver runs`,`Lives stays 1 because Enemy2 is not checked`,`gameOver runs before lives changes`],answer:1,explain:`Lives goes to 0, "other = Enemy1" is false so the else moves Enemy2, then lives ≤ 0 is true, so gameOver runs.`},{q:`Clock1 has TimerInterval 1000. How often does Clock1.Timer run?`,options:[`Every 1000 seconds`,`Once`,`Every second`,`1000 times per second`],answer:2,explain:`TimerInterval is in milliseconds; 1000 ms = 1 second.`},{q:`The score is 29. One more Clock1.Timer runs. What happens?`,options:[`Score 30, and level goes up because 30 modulo 10 = 0`,`Score 30, nothing else`,`Level goes up but score stays 29`,`The game ends`],answer:0,explain:`Score becomes 30 first. The remainder of 30 ÷ 10 is 0, so the level-up blocks run.`}],checks:[{kind:`block`,type:`global_declaration`,min:2,label:`Has at least 2 global variables`},{kind:`block`,type:`procedures_defnoreturn`,label:`Defines a procedure`},{kind:`component`,type:`Clock`,label:`Has a Clock`},{kind:`event`,component:`Clock`,event:`Timer`,label:`Uses a Clock.Timer event`},{kind:`component`,type:`TinyDB`,label:`Has a TinyDB`},{kind:`method`,method:`StoreValue`,label:`Saves data with StoreValue`},{kind:`method`,method:`GetValue`,label:`Loads data with GetValue`}],teacherNotes:`Budget 3 periods: Day 2 starts at "Lose a life", Day 3 at "gameOver". Words-only handlers: StartButton.Click and Screen1.Initialize; blanks: labels, ≤ 0, level-up body. The worked code now resets BOTH enemies and the player and moves the enemy that actually hit (other = Enemy1), which fixes the classic "lost all 3 lives at once" bug; still expect a few teams to see it if they forget the move, which is a good debugging moment. TinyDB data in the Companion is shared across all Companion apps, so insist on unique tags; TinyDB.ClearAll resets during testing.`},{id:`games-capstone`,title:`Capstone: Your Original Game`,subtitle:`Design, build, and playtest a game of your own`,icon:`🕹️`,track:`games`,concepts:[`Game design`,`Planning`,`Iteration`,`Combining everything`],periods:7,xp:{quiz:60,build:300,bonus:100},project:{name:`Your Studio's Original Game`,description:`Your company designs and builds an original game: your idea, your art, your rules, using sprites, motion, game state, and procedures.`},objectives:[`Pick a doable game idea and write a pitch, core loop, controls, and win/lose rules`,`Plan the work: at most 3 MUST features, a NICE list, and who does what`,`Build in sprints that each end with something you can play`,`Playtest with another company and improve the game from their feedback`],intro:`Your **Game Studio** is ready to make its first original game. Real studios do not start by coding. They start with an **idea**, a **plan**, and a quick paper test. Then they build in short **sprints**, test often, and cut features that are not fun. Keep it **small and polished**: a simple game that works beats a big game that does not.`,vocab:[{term:`Core loop`,def:`The action the player does again and again (for example: dodge → collect → speed up).`},{term:`MUST / NICE`,def:`MUST features are needed for the game to work. NICE features are extras if there is time.`},{term:`Sprint`,def:`A short work period that ends with something working.`},{term:`Scope creep`,def:`When a project keeps growing until it cannot be finished.`}],ideas:[{title:`Catcher`,pitch:`Things fall from the top. Drag a basket to catch the good ones and avoid the bad ones.`,uses:[`ImageSprite + Dragged`,`Heading 270 + Speed`,`CollidedWith + other`,`score and lives`,`MoveTo random x`],stretch:`Falling things get faster every 10 points.`},{title:`Dodger`,pitch:`Survive as long as you can while enemies bounce around. A new enemy appears every level.`,uses:[`Ball + Bounce`,`Dragged`,`Clock score`,`levels with modulo`,`TinyDB high score`],stretch:`A shield power-up that makes you safe for 3 seconds.`},{title:`Whack-a-mole`,pitch:`Targets pop up in random spots for a short time. Tap them before they hide.`,uses:[`Visible`,`Clock`,`MoveTo random`,`Touched`,`score and a timer`],stretch:`A "bomb" target that costs you points.`},{title:`Maze run`,pitch:`Guide your character to the goal with arrow buttons without touching the walls.`,uses:[`Buttons that change X and Y`,`CollidedWith walls (ImageSprites)`,`if`,`timer`,`procedures`],stretch:`Tilt controls with the AccelerometerSensor (Toolbox step).`},{title:`Endless runner (lite)`,pitch:`Obstacles slide in from the right. Tap to jump over them. How far can you get?`,uses:[`Heading 180 + Speed`,`MoveTo to reset obstacles`,`Clock for the jump`,`score`,`gameOver procedure`],stretch:`Two kinds of obstacles with different speeds.`}],steps:[{title:`Pick an idea and pitch it`,body:`Look at the **idea cards** below, or invent your own game of the same size. As a company, choose ONE. Write your pitch in the **planner card** in AppVenture. Your twist is what makes it yours: a theme, a rule, or a control. Get a thumbs-up from your teacher before you build.`,simple:`Choose one idea card, or a small idea of your own. Write your pitch in the planner. Ask your teacher to approve it.`,frames:[`It's a game where you ___.`,`Over and over, the player ___. (core loop)`,`You control it by ___ (tap / drag / buttons).`,`You win when ___. You lose when ___.`,`Our twist is ___.`]},{title:`Plan the work`,body:`In the planner, list **at most 3 MUST features**: the smallest game that is still fun. Put everything else on the **NICE** list. Then choose roles: one **Builder** (hands on the mouse) and one **Navigator** (reads the plan, spots mistakes). Swap roles every sprint and record it in the contribution log.`,simple:`Write up to 3 MUST features and a NICE list. Pick who is Builder and who is Navigator. Switch every sprint.`,frames:[`MUST 1: The player can ___.`,`MUST 2: The game keeps track of ___.`,`MUST 3: The game ends when ___.`,`NICE: ___`],stuck:[`Too many MUST features? Ask: "Is the game still a game without this?" If yes, it is NICE.`]},{title:`Paper test, then Sprint 1: something moves`,editor:`designer`,day:2,body:`First, 10 minutes: draw your screen on paper and "play" it with paper pieces. Fix anything confusing. Then **Sprint 1**: build the board, the player, your controls, and one thing to dodge, catch, or tap. Plain colored balls are fine for now. Real art comes later.`,simple:`Test your idea on paper for 10 minutes. Then build the board, the player and the controls. Add one thing that moves.`,check:`Done when: you can control the player on your phone, and one object moves.`},{title:`Toolbox: blocks you may want`,editor:`blocks`,body:"Some games need a few new tools. Use only what your plan needs.\n\n- **Sound**: upload a short clip, add a Sound component, set its Source, then `call Sound1.Play`.\n- **Visible**: `set Coin.Visible to false` hides a sprite.\n- **Which sprite hit me?** `if other = Coin` (Logic =) inside CollidedWith.\n- **Tilt**: an AccelerometerSensor gives `xAccel`. Move the player by it. If it goes the wrong way, change − to +.",simple:`New tools: Sound plays a clip. Visible hides things. "other = Coin" checks what you hit. Tilt uses the AccelerometerSensor.`,blocks:[`when Player.CollidedWith other do`,`  if other = Coin`,`    call Sound1.Play`,`    set Coin.Visible to false`,`when AccelerometerSensor1.AccelerationChanged xAccel yAccel zAccel do`,`  set Player.X to Player.X - get xAccel`],newBlocks:[{name:`Sound`,where:`Palette → Media`,what:`Plays a short audio file you upload.`},{name:`AccelerometerSensor`,where:`Palette → Sensors`,what:`Tells you how the phone is tilted.`}],stuck:[`No sound? Check the phone is not on silent, and that Source matches the uploaded file name exactly.`,`Tilt does nothing on the emulator. Tilt needs a real phone.`]},{title:`Sprint 2: rules and state`,editor:`blocks`,day:3,body:"Add score, lives or a timer, how you win and lose, and a **Clock** game loop. Use **procedures** for big moments: `startGame` and `endGame`. Swap Builder and Navigator now. This sprint usually takes **two periods**. Write everything yourselves: you have done each piece before in Dodge It 2.0.",simple:`Add score, lives or a timer. Add winning and losing. Make startGame and endGame procedures. Switch roles.`,check:`Done when: a full round can start, end, and start again with everything reset.`,stuck:[`Look back at resetGame and gameOver in Dodge It 2.0. Your game needs the same kinds of procedures.`]},{title:`When you are stuck`,body:`Use these steps in order before asking the teacher:

1. **Read** the warning or error (the yellow ⚠ or red ✖ at the bottom left).
2. **Test a smaller piece**: right-click a block → **Do It** to see its value on a connected phone.
3. **Check names**: is it Enemy1 or Enmey1? Same tag spelling?
4. **Ask another company** (1 minute).
5. **Ask the teacher**, and say what you already tried.`,simple:`Stuck? 1. Read the error. 2. Test one block with Do It. 3. Check spelling. 4. Ask another company. 5. Ask the teacher.`,newBlocks:[{name:`Do It`,where:`right-click any block (phone connected)`,what:`Runs that one block now and shows the result.`}],frames:[`We are stuck on ___. We already tried ___.`]},{title:`Playtest with another company`,editor:`phone`,day:5,body:`Swap phones with another company. Watch **quietly** while they play. Then ask the three questions below and write down the answers. As a team, pick the **top 2 fixes** and make them. Balance difficulty by changing speeds, sizes, and timer lengths.`,simple:`Let another company play. Watch and do not help. Ask the questions. Fix the 2 most important things.`,frames:[`Tester: The most fun part was ___.`,`Tester: I got confused when ___.`,`Tester: It felt too easy / too hard because ___.`,`Our top 2 fixes are ___ and ___.`]},{title:`Sprint 3: polish and submit`,day:6,body:"Swap roles again. Add real art, a sound, and an instructions Label that hides (Visible false) when the game starts. Only then try one NICE feature. Clean up blocks (right-click → Clean up Blocks). Export the `.aia` and submit it. In the notes, write what you changed after playtesting. Fill in the contribution log for each partner.",simple:`Add real pictures, a sound, and instructions. Try one NICE feature. Clean up your blocks. Submit and fill in who did what.`,check:`Done when: someone new can open the app, read how to play, and finish a round without your help.`,frames:[`After playtesting we changed ___ because the tester ___.`]}],devices:[{need:`No phone today`,fallback:`Build with the emulator. Avoid tilt controls; use drag or buttons instead.`},{need:`iPhone`,fallback:`Sprites, Clock, TinyDB and Sound work in the iOS Companion.`}],challenge:{title:`Bonus: Level up the design`,body:`Add one feature from your NICE list that changes how the game plays: a second level with a new layout, a power-up, or tilt controls. In your notes, explain how playtesters reacted to it.`},quiz:[{q:`What is a game's "core loop"?`,options:[`The Clock.Timer block`,`The main action the player repeats again and again`,`A for-each loop in your blocks`,`The final level`],answer:1,explain:`The core loop is the repeating gameplay, like dodge → collect → speed up. If it is fun, the game is fun.`},{q:`Your plan has 6 MUST features and it is day 4. What should you do?`,options:[`Work faster and add them all`,`Move features to the NICE list until only the smallest fun game is left`,`Start a new idea`,`Skip playtesting`],answer:1,explain:`Cutting scope keeps the project finishable. A small working game beats a big broken one.`},{q:`Inside Player.CollidedWith you want to add a point ONLY when the player touches a Coin. Which test do you use?`,options:[`if Player.Visible`,`if other = Coin`,`if score = Coin`,`if Coin.Enabled`],answer:1,explain:`"other" is the sprite you hit. Comparing it with Coin tells you it was the coin.`},{q:`At the end of each sprint, your game should be:`,options:[`Completely finished`,`Playable in some form, even if rough`,`Published to the Gallery`,`Exported to a new project`],answer:1,explain:`Ending each sprint with something playable means you always have a working version to test.`}],checks:[{kind:`component`,type:`Canvas`,label:`Has a Canvas`},{kind:`anyComponent`,types:[`ImageSprite`,`Ball`],label:`Has an ImageSprite or Ball`},{kind:`anyBlock`,types:[`procedures_defnoreturn`,`procedures_defreturn`],label:`Defines a procedure`},{kind:`block`,type:`global_declaration`,min:2,label:`Has at least 2 global variables`},{kind:`block`,type:`controls_if`,label:`Uses an if block`},{kind:`component`,type:`Clock`,label:`Has a Clock`},{kind:`totalBlocks`,min:40,label:`Has at least 40 blocks`}],teacherNotes:`Seven periods: Day 1 pick + plan, Day 2 paper test + Sprint 1, Days 3–4 Sprint 2, Day 5 playtest, Day 6 Sprint 3, Day 7 buffer/finish. Approve each plan in the planner card before building; push teams to 3 MUST features. Builder/Navigator roles swap every sprint and are recorded in the contribution log; check it against what you see. The idea cards are all buildable with this path's skills; the Toolbox step covers Sound, Visible, other-comparison and tilt. The auto-checks can be met by a reskinned Dodge It, so judge originality from the plan and the twist. Struggling teams: the Dodger card with one new mechanic is a fine target.`}],Rn=[{id:`media-camera`,title:`Camera & Images`,subtitle:`Snap, pick, and flip through photos`,icon:`📸`,track:`media`,concepts:[`Media components`,`Event parameters`,`Lists`,`Index variables`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Photo Booth`,description:`Take photos with the camera or pick them from the gallery, keep them in a list, flip through them with Next and Previous, and share your favorite.`},objectives:[`Use the Camera and ImagePicker components to get photos into an app`,`Read an event parameter (the "image" from AfterPicture) and use it in your code`,`Store photos in a list and move through it with an index variable`,`Share a file to other apps with the Sharing component`],intro:`Welcome to the **Media House**! Media apps use the phone's camera, microphone and screen. Today your company builds a **Photo Booth**. The app keeps photos in a **list**. An **index** variable remembers which photo is showing. Photo galleries, music players and slideshows all use this same "list + index" pattern.`,vocab:[{term:`Event parameter`,def:`A value an event gives your code, like the "image" in Camera.AfterPicture. Hover over it to get a "get image" block.`},{term:`File path`,def:`Text that says where a file is on the phone. The list stores file paths, not the pictures themselves.`},{term:`Index`,def:`A number that says which item in a list you mean. In App Inventor the first item is index 1.`},{term:`Sharing`,def:`A non-visible component that sends text or a file to another app (messages, email, Drive).`}],devices:[{need:`iPhone`,fallback:`Use the "From gallery" ImagePicker. On some iPhones, camera photos cannot be shared, so test Share with a gallery photo.`},{need:`No phone (emulator only)`,fallback:`The emulator has no camera. Upload 3 images (Media panel → Upload File) and add them to the photos list in Screen1.Initialize. Next, Previous and the index work the same.`},{need:`School device blocks the camera`,fallback:`Skip btnSnap. Use the ImagePicker, or the uploaded images from the line above. You still pass every check.`}],steps:[{title:`Lay out the booth`,editor:`designer`,body:'Start a new project named `PhotoBooth`. Add:\n\n- **User Interface → Image**: Width *Fill parent*, Height `300` pixels\n- A **HorizontalArrangement** with four Buttons: `btnSnap` ("Snap"), `btnPrev` ("◀"), `btnNext` ("▶"), `btnShare` ("Share")\n- **Media → ImagePicker**: rename it `pickGallery`, Text "From gallery"\n- **Media → Camera** and **Social → Sharing** (non-visible)\n- A **Label** `lblCount`',simple:`Make a new project called PhotoBooth. Add an Image, four buttons in a row, an ImagePicker, a Camera, a Sharing component and a Label.`,newBlocks:[{name:`Image`,where:`Palette → User Interface`,what:`Shows a picture. Set its Picture property to a file path.`},{name:`ImagePicker`,where:`Palette → Media`,what:`A button that opens the phone's photo gallery.`},{name:`Camera`,where:`Palette → Media`,what:`Opens the phone camera and gives you the photo's file path.`}]},{title:`Make a list and an index`,editor:`blocks`,body:`The app must remember **all** the photos and **which one** is showing. Make two global variables: an empty list for photo paths, and an index that starts at 0 (no photo yet).`,simple:`Make two variables. "photos" is an empty list. "index" starts at 0.`,blocks:[`initialize global photos to (create empty list)`,`initialize global index to 0`]},{title:`Write a showPhoto procedure`,editor:`blocks`,body:"Several buttons need to update
