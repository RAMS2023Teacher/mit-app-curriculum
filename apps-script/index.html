the screen, so put that code in **one procedure**. The `if` stops a crash when the list is still empty: you cannot select item 1 from an empty list.",simple:`Make one procedure that shows the current photo. First check that the list is not empty.`,blocks:[`to showPhoto`,`  if (length of list(get global photos) > 0)`,`    set Image1.Picture to select list item(list: get global photos, index: get global index)`,`    set lblCount.Text to join("Photo ", get global index, " of ", length of list(get global photos))`,`  else`,`    set lblCount.Text to "No photos yet"`],stuck:[`"Select list item: index too large"? The index is bigger than the list length. Check where you change the index.`]},{title:`Capture photos`,editor:`blocks`,body:"When **Snap** is clicked, open the camera. `Camera1.AfterPicture` runs next and gives you **image** (a file path). Add it to the list, move the index to the newest photo, and show it.\n\nThen fill in the blanks to do the same for the gallery. The picked photo is in `pickGallery.Selection`.",simple:`Snap opens the camera. Add the new photo to the list and show it. Then do the same for the gallery button.`,blocks:[`when btnSnap.Click do`,`  call Camera1.TakePicture`,`when Camera1.AfterPicture image do`,`  call add items to list(list: get global photos, item: get image)`,`  set global index to length of list(get global photos)`,`  call showPhoto`,`when pickGallery.AfterPicking do`,`  call add items to list(list: get global photos, item: ___)`,`  set global index to ___`,`  call showPhoto`],check:`Test now: take a photo or pick one. You should see it in the Image and "Photo 1 of 1" in the label.`,stuck:[`Tapped "Deny" on the camera question? On Android go to Settings → Apps → MIT AI2 Companion → Permissions → Camera → Allow.`,`Nothing shows? Check that "call showPhoto" is the last block inside each event.`]},{title:`Next, Previous and wrap-around`,editor:`blocks`,day:2,body:"Next adds 1 to the index. If the index goes past the last photo, it **wraps around** to 1. Fill in the blank. Then build `btnPrev.Click` yourself, with no blocks shown: subtract 1, and if the index goes below 1, jump to the last photo.",simple:`Next goes to the next photo. After the last photo, go back to photo 1. Then build Previous by yourself.`,blocks:[`when btnNext.Click do`,`  if (length of list(get global photos) > 0)`,`    set global index to (get global index + 1)`,`    if (get global index > ___)`,`      set global index to 1`,`    call showPhoto`],check:`Test now: with 3 photos, tap ▶ four times. You should see Photo 1, 2, 3, then 1 again. Do the same with ◀.`,stuck:[`Previous jumps to "Photo 0"? Your check should be "index < 1", and then set the index to the length of the list.`]},{title:`Share your favorite`,editor:`blocks`,body:`The Sharing component sends a file to another app. Only share if a photo is showing.`,simple:`Share sends the current photo to another app. Only do it when a photo is showing.`,blocks:[`when btnShare.Click do`,`  if (get global index > 0)`,`    call Sharing1.ShareFile(file: select list item(list: get global photos, index: get global index))`],check:`Test now: tap Share. You should see a list of apps to send the photo to.`,stuck:[`Share does nothing on an iPhone? Some iPhones cannot share camera photos. Pick a photo from the gallery and try again.`]},{title:`Test, export and submit`,editor:`phone`,body:`Test every button with **zero** photos first. Does anything crash? Then add three photos and flip past both ends. Close the app and open it again: the photos are gone. That is normal, because variables are forgotten when an app closes. Export with **Projects → Export selected project (.aia)**.`,simple:`Test with no photos. Then test with three photos. Export the .aia file.`,stuck:[`Photos disappear when the app closes? That is expected. A list in a variable is not saved.`]}],remix:{title:`Remix: Shuffle button`,spec:`Add a "Shuffle" button that jumps to a random photo. If there are no photos, it should show "No photos yet" and not crash.`,hints:[`You need "random integer from 1 to ___" from the Math drawer.`,`The top number is the length of the photos list.`,`Put it inside an if that checks the list is not empty, then call showPhoto.`]},challenge:{title:`Bonus: Delete & slideshow`,body:'Add a **Delete** button that removes the current photo with `remove list item`. Fix the index so it never points past the end. Then add a **Clock** and a "Slideshow" button that turns **TimerEnabled** on and off to move to the next photo every 2 seconds.'},quiz:[{q:`The photos list has 3 items and index is 1. The user taps ◀ Previous (with wrap-around). Which photo shows?`,options:[`Photo 0`,`Photo 1`,`Photo 2`,`Photo 3`],answer:3,explain:`Index 1 minus 1 is 0. That is below 1, so it wraps to the last photo, number 3.`},{q:`Your list has 4 photos and global index is 4. The user taps Next. With wrap-around, what should index become?`,options:[`5`,`0`,`1`,`4`],answer:2,explain:`Index 5 does not exist, so the "if index > length" check sets it back to 1, the first item in App Inventor lists.`},{q:`Why put the screen-updating code in a showPhoto procedure?`,options:[`Procedures make the app run on iPhones`,`App Inventor requires every app to have a procedure`,`Several events need the same code, so one procedure avoids repeating it and fixes bugs in one place`,`Procedures make photos load in higher quality`],answer:2,explain:`Snap, gallery, Next and Previous all call showPhoto. That is the DRY principle: Don't Repeat Yourself.`},{q:`The app crashes when you tap Next before taking any photos. What is the best fix?`,options:[`Wrap the code in an if that checks the list length is greater than 0`,`Delete the Next button`,`Set the index to 100`,`Make the Image component bigger`],answer:0,explain:`Selecting an item from an empty list is an error. Guard it with a conditional so the code only runs when there is a photo.`}],checks:[{kind:`anyComponent`,types:[`Camera`,`ImagePicker`],label:`Has a Camera or ImagePicker`},{kind:`component`,type:`Image`,label:`Has an Image to display photos`},{kind:`anyBlock`,types:[`lists_create_with`,`lists_add_items`],label:`Stores photos in a list`},{kind:`block`,type:`lists_select_item`,label:`Selects a photo from the list by index`},{kind:`block`,type:`controls_if`,label:`Uses a conditional (empty list / wrap-around)`},{kind:`anyBlock`,types:[`procedures_defnoreturn`,`procedures_defreturn`],label:`Defines a procedure`}],teacherNotes:`Device fallbacks are now student-facing (see the device box). Demonstrate the empty-list crash live: tap Next with no photos and read the error together. The Previous handler is the first "build it yourself" moment on this path; let students struggle a few minutes before showing the mirror-image answer. Photos are file paths in a variable, so they vanish on restart (TinyDB is on the Tools path; mention it to curious students).`},{id:`media-paint`,title:`Drawing Canvas`,subtitle:`Turn your finger into a paintbrush`,icon:`🎨`,track:`media`,concepts:[`Canvas coordinates`,`Event parameters`,`Properties as state`,`Sliders`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Paint Pad`,description:`A finger-painting app with color buttons, a brush-size slider, tap-to-stamp dots, a Clear button, and a way to save your drawing.`},objectives:[`Explain how x/y coordinates work on a Canvas (0,0 is the top-left corner)`,`Use the parameters of Canvas.Dragged and Canvas.Touched to draw lines and circles`,`Change drawing properties (PaintColor, LineWidth) while the app runs`,`Read a Slider value with the PositionChanged event`],intro:`Every drawing app works the same way. As your finger moves, the phone reports many **x, y coordinates**. The app draws a short line from each point to the next. Thousands of tiny lines look like one smooth stroke. Today your company builds **Paint Pad**. You will use coordinates again for animation, maps and games.`,vocab:[{term:`Canvas`,def:`A drawing surface component. It can draw lines, circles and text, and detect touches.`},{term:`Coordinate`,def:`A pair of numbers (x, y) for a spot on the Canvas. x grows to the right and y grows DOWN.`},{term:`Dragged event`,def:`Runs again and again while a finger moves on the Canvas. It gives the previous point and the current point.`},{term:`Slider`,def:`A bar you drag. It reports a number (ThumbPosition) between MinValue and MaxValue.`}],devices:[{need:`No phone (emulator only)`,fallback:`Drawing works in the emulator: hold the mouse button down and drag.`},{need:`Save does not show in the Gallery`,fallback:`Newer Android phones keep saved drawings inside the app. Show the saved path in the label instead, or share it with Sharing.ShareFile.`}],steps:[{title:`Build the studio`,editor:`designer`,body:'New project: `PaintPad`. Add:\n\n- **Drawing and Animation → Canvas**: Width *Fill parent*, Height `350` pixels, BackgroundColor White, LineWidth `5`\n- A **HorizontalArrangement** with Buttons `btnRed`, `btnBlue`, `btnBlack` (set each BackgroundColor to match)\n- **User Interface → Slider** `sldSize`: MinValue `1`, MaxValue `30`, ThumbPosition `5`\n- Buttons `btnClear` ("Clear") and `btnSave` ("Save")\n- A **Label** `lblStatus`',simple:`Make a new project called PaintPad. Add a Canvas, three color buttons in a row, a Slider, Clear and Save buttons, and a Label.`,newBlocks:[{name:`Canvas`,where:`Palette → Drawing and Animation`,what:`A surface you can draw on and touch.`},{name:`Slider`,where:`Palette → User Interface`,what:`A bar you drag to choose a number.`}]},{title:`Draw with Dragged`,editor:`blocks`,body:'`Canvas1.Dragged` gives you **prevX, prevY** (where the finger was a moment ago) and **currentX, currentY** (where it is now). Draw a line between them. Hover over each parameter to get its "get" block. Fill in the two blanks.',simple:`When the finger moves, draw a line from the old point to the new point.`,blocks:[`when Canvas1.Dragged startX startY prevX prevY currentX currentY draggedAnySprite do`,`  call Canvas1.DrawLine(x1: get prevX, y1: get prevY, x2: ___, y2: ___)`],check:`Test now: drag your finger on the white area. You should see a black line follow it.`,stuck:[`The line jumps from the top-left corner? You used startX/startY. Use currentX and currentY.`]},{title:`Tap to stamp a dot`,editor:`blocks`,body:"A single tap is not a drag, so nothing appears. Build this one **from words only**:\n\n- Use `when Canvas1.Touched`. It gives you **x** and **y**.\n- Inside it, call `Canvas1.DrawCircle` at x, y.\n- Make the radius half the brush size: `Canvas1.LineWidth / 2`. Set fill to true.",simple:`Build it yourself: when the Canvas is touched, draw a filled circle where the finger is.`,check:`Test now: tap once. You should see a round dot the same size as your lines.`,stuck:[`No dot? Check that "fill" is set to true, and that the radius is not 0.`]},{title:`Colors and brush size`,editor:`blocks`,day:2,body:"The Canvas remembers its **PaintColor** and **LineWidth**. A change only affects lines drawn *after* it. The Slider gives you **thumbPosition**. Round it to a whole number.\n\nBuild `btnBlue` and `btnBlack` yourself, the same way as red.",simple:`The red button changes the paint color. The slider changes the brush size. Make the blue and black buttons yourself.`,blocks:[`when btnRed.Click do`,`  set Canvas1.PaintColor to (color red)`,`when sldSize.PositionChanged thumbPosition do`,`  set Canvas1.LineWidth to round(get thumbPosition)`,`  set lblStatus.Text to join("Brush size: ", ___)`],check:`Test now: pick blue and move the slider to the right. New lines should be blue and thicker. Old lines stay the same.`,stuck:[`The label says "Brush size: 12.4567"? Put the round block around thumbPosition.`]},{title:`Clear and save`,editor:`blocks`,body:"`Canvas1.Clear` erases everything. `Canvas1.Save` saves the drawing as a picture and **gives back** its file path. Build `btnClear.Click` yourself. Save is below.",simple:`Clear erases the drawing. Save stores it and shows where it was saved.`,blocks:[`when btnSave.Click do`,`  set lblStatus.Text to join("Saved to ", call Canvas1.Save)`],check:`Test now: draw, tap Save, then Clear. You should see a file path in the label, then a blank canvas.`,stuck:[`Cannot find the saved picture in your Gallery? Newer phones keep it inside the app. The path in the label proves it worked.`]},{title:`Test, export and submit`,editor:`phone`,body:"Draw slowly, then quickly. Do you see gaps? Tap dots at different sizes. Try every color, then Clear and Save. Export the `.aia` and submit it below.",simple:`Test all the buttons and the slider. Export the .aia file and submit it.`}],remix:{title:`Remix: Spray mode`,spec:`Add a "Spray" button that turns spray mode on and off. In spray mode, dragging draws small dots near the finger (a few pixels away at random) instead of lines.`,hints:[`Use a global variable "spray" that is true or false. The button flips it.`,`In Dragged, use if / else: if spray, draw a small circle, else draw the line.`,`For "near the finger", use currentX + random integer from -10 to 10.`]},challenge:{title:`Bonus: Eraser & rainbow brush`,body:`Add an **Eraser** button that sets PaintColor to the Canvas background color. Then add a "Rainbow" mode: a global list of colors and an index that moves forward every time Dragged runs, so the stroke changes color as you draw.`},quiz:[{q:`LineWidth is 10. You tap the Canvas at (50, 80). What does your Touched code draw?`,options:[`A line from (0,0) to (50,80)`,`A filled circle at (50, 80) with radius 5`,`A circle at (80, 50)`,`Nothing`],answer:1,explain:`Touched gives x = 50 and y = 80. The radius is LineWidth / 2 = 5.`},{q:`Why does Paint Pad draw a line from (prevX, prevY) to (currentX, currentY) inside Dragged?`,options:[`Dragged only fires once per stroke`,`Dragged fires many times as the finger moves; connecting each pair of points makes a smooth stroke`,`DrawLine is the only block that works on a Canvas`,`It makes the app save automatically`],answer:1,explain:`Each Dragged event is one tiny movement. Thousands of short lines connected end to end look like one smooth stroke.`},{q:`You tap the Blue button and then draw. Your OLD red lines…`,options:[`turn blue`,`stay red, because PaintColor only affects what is drawn after it changes`,`disappear`,`turn black`],answer:1,explain:`PaintColor is a setting for future drawing. Lines already on the Canvas do not change.`},{q:`Which event tells you the Slider has moved, and what value does it give?`,options:[`Slider.Click, giving true/false`,`Slider.PositionChanged, giving thumbPosition`,`Slider.Dragged, giving x and y`,`Slider.AfterPicking, giving Selection`],answer:1,explain:`PositionChanged runs whenever the thumb moves and gives the new thumbPosition number.`}],checks:[{kind:`component`,type:`Canvas`,label:`Has a Canvas`},{kind:`event`,component:`Canvas`,event:`Dragged`,label:`Uses "when Canvas.Dragged"`},{kind:`method`,method:`DrawLine`,label:`Calls Canvas.DrawLine`},{kind:`component`,type:`Slider`,label:`Has a Slider`},{kind:`event`,component:`Slider`,event:`PositionChanged`,label:`Uses "when Slider.PositionChanged"`},{kind:`method`,method:`Clear`,label:`Has a way to Clear the canvas`}],teacherNotes:`Unplugged warm-up: grid on the board with (0,0) at the top-left; students "draw" by calling out coordinates. Many expect y to grow upward as in math class. Touched and Clear are words-only on purpose; circulate and ask "which event? which method?" rather than giving blocks. Fast strokes on slow phones look jagged, which is a good talk about how often events fire.`},{id:`media-sound`,title:`Sound Studio`,subtitle:`Record, store, and play back your own audio`,icon:`🎙️`,track:`media`,concepts:[`Recording media`,`Lists of files`,`ListView`,`App state`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Sound Studio`,description:`Record voice clips, collect them in a playlist, and tap any clip in the list to play it back. A small podcast studio on your phone.`},objectives:[`Record audio with SoundRecorder Start/Stop and handle AfterSoundRecorded`,`Play audio files by setting Player.Source and calling Player.Start`,`Keep two parallel lists in sync (file paths and display names)`,`Show a list on screen with ListView and respond to AfterPicking`],intro:`Podcasts, voice memos and beat makers are all audio apps. Today your Media House builds a **Sound Studio**. It uses **events** for record and stop, a **variable** that remembers if you are recording, **lists** that hold every clip, and **conditionals** so one button can do two jobs. A ListView shows your list as a playlist you can tap.`,vocab:[{term:`SoundRecorder`,def:`A non-visible component that records from the microphone and gives you the saved file path.`},{term:`Player`,def:`Plays an audio file. Set its Source to a file path, then call Start.`},{term:`ListView`,def:`A list on the screen you can scroll. Its Elements property is a list. AfterPicking runs when a row is tapped.`},{term:`Parallel lists`,def:`Two lists where item N of one matches item N of the other, like a clip's name and its file.`}],devices:[{need:`No phone (emulator only)`,fallback:`The emulator usually cannot record. Upload 3 short sound files (Media panel → Upload File). In Screen1.Initialize, add their names to both lists. Skip the Record button; the playlist works the same.`},{need:`iPhone`,fallback:`Recording may not work in the iPhone Companion. Use the uploaded-files option above, or test recording on a partner's Android phone.`},{need:`School device blocks the microphone`,fallback:`Use the uploaded-files option above. You still pass every check if you keep the SoundRecorder component in the project.`}],steps:[{title:`Design the studio`,editor:`designer`,body:'New project: `SoundStudio`. Add:\n\n- A Button `btnRecord` with Text "● Record" and a big font\n- A Label `lblStatus` ("Ready")\n- **User Interface → ListView** `lstClips` (Height *Fill parent*)\n- **Media → SoundRecorder** and **Media → Player** (non-visible)',simple:`Make a new project called SoundStudio. Add a Record button, a Label, a ListView, a SoundRecorder and a Player.`,newBlocks:[{name:`SoundRecorder`,where:`Palette → Media`,what:`Records sound from the microphone.`},{name:`Player`,where:`Palette → Media`,what:`Plays a sound file.`},{name:`ListView`,where:`Palette → User Interface`,what:`Shows a list on the screen. Users can tap a row.`}]},{title:`Variables for state and storage`,editor:`blocks`,body:`One Button will start **and** stop recording, so the app must remember which mode it is in. That memory is called **state**. You also need two lists: file paths (for the Player) and names (for the ListView).`,simple:`Make three variables: "recording" (true or false), "clipFiles" (a list) and "clipNames" (a list).`,blocks:[`initialize global recording to false`,`initialize global clipFiles to (create empty list)`,`initialize global clipNames to (create empty list)`]},{title:`One button, two jobs`,editor:`blocks`,body:`If you are recording, stop. Otherwise, start. Flip the variable and change the button text so the user knows what a tap will do. Fill in the two blanks.`,simple:`If recording, stop. If not, start. Change the button text each time.`,blocks:[`when btnRecord.Click do`,`  if get global recording`,`    call SoundRecorder1.Stop`,`    set global recording to ___`,`    set btnRecord.Text to "● Record"`,`  else`,`    call SoundRecorder1.Start`,`    set global recording to ___`,`    set btnRecord.Text to "■ Stop"`,`    set lblStatus.Text to "Recording..."`],check:`Test now: tap the button twice. It should change to "■ Stop", then back to "● Record".`,stuck:[`Tapped "Deny" on the microphone question? On Android go to Settings → Apps → MIT AI2 Companion → Permissions → Microphone → Allow.`,`The button never changes back? Check that one blank is false and the other is true.`]},{title:`Save each clip to the playlist`,editor:`blocks`,day:2,body:'After `Stop`, App Inventor runs `AfterSoundRecorded` and gives you **sound**: the clip\'s file path. Build this event **from words only**:\n\n1. Add `get sound` to `clipFiles`.\n2. Add `join("Clip ", length of list(clipFiles))` to `clipNames`.\n3. Set `lstClips.Elements` to `clipNames`.\n4. Set `lblStatus.Text` to "Saved!"',simple:`Build it yourself: when a recording is saved, add the file and a name to the lists, then show the names in the ListView.`,check:`Test now: record two short clips. You should see "Clip 1" and "Clip 2" in the list.`,stuck:[`The list stays empty? Check that you set lstClips.Elements AFTER adding to clipNames.`]},{title:`Tap to play`,editor:`blocks`,body:"When a row is tapped, `lstClips.SelectionIndex` is its position. The lists are **parallel**, so the same position in `clipFiles` is the right sound file. Fill in the blank.",simple:`When a clip name is tapped, find the file at the same position and play it.`,blocks:[`when lstClips.AfterPicking do`,`  set Player1.Source to select list item(list: get global clipFiles, index: ___)`,`  call Player1.Start`,`  set lblStatus.Text to join("Playing ", lstClips.Selection)`],newBlocks:[{name:`ListView.SelectionIndex`,where:`click lstClips in the Blocks panel`,what:`The position (1, 2, 3…) of the row the user tapped.`}],check:`Test now: tap "Clip 1". You should hear your first recording.`,stuck:[`Plays the wrong clip? You may have used Selection (the text) instead of SelectionIndex (the number).`]},{title:`Test, export and submit`,editor:`phone`,body:"Record three clips: your company name, your slogan and a fun fact. Tap each in the list. Do they play the right clip? Close and reopen the app: the clips are gone, because lists in variables are not saved. Export the `.aia` and submit it.",simple:`Record three clips and play each one. Export the .aia file and submit it.`}],remix:{title:`Remix: Surprise clip`,spec:`Add a "Surprise" button that plays a random clip from the playlist. If there are no clips yet, show "Record something first!" and do not crash.`,hints:[`Check the length of clipFiles with an if first.`,`Pick a random index from 1 to the length of the list.`,`Use that same index to set Player1.Source, then call Player1.Start.`]},challenge:{title:`Bonus: Rename & delete clips`,body:'Add a TextBox so the user can name a clip before saving it (use the name if the TextBox is not empty, otherwise "Clip N"). Then add a Delete button that removes the selected clip from **both** lists with `remove list item`, so they stay in sync.'},quiz:[{q:`recording is false. The user taps btnRecord two times. What does the button say now?`,options:[`"■ Stop"`,`"● Record"`,`"Recording..."`,`"Saved!"`],answer:1,explain:`Tap 1 starts recording and shows "■ Stop". Tap 2 stops and changes it back to "● Record".`},{q:`Why does Sound Studio need a "recording" true/false variable?`,options:[`SoundRecorder cannot work without one`,`So one button knows whether to Start or Stop: the app has to remember its state`,`To make the recording louder`,`Variables are needed for the ListView to scroll`],answer:1,explain:`One button doing two jobs needs to remember which mode the app is in. That memory is called state.`},{q:`clipNames = ["Clip 1","Clip 2","Clip 3"]. The user taps "Clip 2". What does lstClips.SelectionIndex hold?`,options:[`"Clip 2"`,`1`,`2`,`3`],answer:2,explain:`SelectionIndex is the position of the tapped row. Lists in App Inventor start at 1, so the second row is 2.`},{q:`You delete an item from clipNames but forget clipFiles. What goes wrong?`,options:[`Nothing; the lists are linked automatically`,`The lists are out of sync, so tapping a name plays the wrong clip`,`The app records twice as long`,`The ListView turns blank forever`],answer:1,explain:`Parallel lists only work if they change together. Remove the same index from both.`}],checks:[{kind:`component`,type:`SoundRecorder`,label:`Has a SoundRecorder`},{kind:`component`,type:`Player`,label:`Has a Player`},{kind:`event`,component:`SoundRecorder`,event:`AfterSoundRecorded`,label:`Uses "when SoundRecorder.AfterSoundRecorded"`},{kind:`component`,type:`ListView`,label:`Has a ListView playlist`},{kind:`event`,component:`ListView`,event:`AfterPicking`,label:`Uses "when ListView.AfterPicking"`},{kind:`block`,type:`lists_add_items`,label:`Adds recordings to a list`}],teacherNotes:`Thirty students recording at once is loud: headphones with a mic, hallway recording, or "whisper mode". Students on the uploaded-files fallback (emulator, iOS, blocked mic) should still build AfterSoundRecorded for the check, even if they cannot run it. The parallel-lists idea is a big step; draw two columns on the board and cross out the same row in both.`},{id:`media-capstone`,title:`Capstone: Your Media App`,subtitle:`Design, build, test, and polish an original media app`,icon:`🎬`,track:`media`,concepts:[`Design process`,`Requirements`,`Iteration`,`User testing`],periods:7,xp:{quiz:60,build:300,bonus:100},project:{name:`Your Original Media App`,description:`Your company invents its own media app, such as a photo scavenger hunt, a team soundboard or a draw-on-a-photo app, and takes it from idea to tested product.`},objectives:[`Write a one-sentence pitch that names the audience and what your app does for them`,`Plan up to 3 must-have features and a list of nice-to-haves`,`Build in short sprints, testing on a real phone after every sprint`,`Run a user test with another company and improve the app based on their feedback`],intro:`This is the big one. Real media companies do not start by coding. They start with **people**: who will use this, and why will they like it? Your company follows the **design process**: pitch → plan → build in sprints → test with users → improve. Use the blocks from your path and core lessons, plus the Toolbox step below.`,vocab:[{term:`Pitch`,def:`A short description that makes people want your app: "For [audience], our app [does what] so they can [benefit]."`},{term:`Wireframe`,def:`A quick sketch of each screen showing where components go. Boxes and labels, no art.`},{term:`Sprint`,def:`A short work session with one clear goal, ending with something you can test.`},{term:`MVP`,def:`Minimum Viable Product: the smallest version of your app that still does its main job.`},{term:`Iterate`,def:`Improve in rounds: build, test, learn, and change.`}],ideas:[{title:`Photo Scavenger Hunt`,pitch:`Players get a list of things to find, take a photo of each one, and see their score.`,uses:[`Camera or ImagePicker`,`a list of prompts + index`,`score variable`,`if / else`],stretch:`A Clock timer for each prompt.`},{title:`Team Soundboard`,pitch:`Record your team's catchphrases and play them back from a named playlist.`,uses:[`SoundRecorder`,`Player`,`parallel lists`,`ListView`],stretch:`A TextBox to name each clip before saving.`},{title:`Doodle on a Photo`,pitch:`Pick a photo, draw on top of it, add a caption, and save it.`,uses:[`ImagePicker`,`Canvas.BackgroundImage`,`Dragged + DrawLine`,`DrawText`,`Slider`],stretch:`Color buttons and an eraser.`},{title:`Before & After Slideshow`,pitch:`Collect photos of a project (a drawing, a room, a plant) and play them as an automatic slideshow.`,uses:[`ImagePicker`,`list + index`,`Clock`,`showPhoto procedure`],stretch:`A speed Slider for the slideshow.`},{title:`Mood Journal`,pitch:`Each day, pick a photo and record a short voice note about your day. Flip back through past days.`,uses:[`ImagePicker`,`SoundRecorder`,`Player`,`parallel lists`,`Next/Previous`],stretch:`Show the date with each entry.`}],devices:[{need:`Camera or microphone blocked, or no phone`,fallback:`Pick an idea that uses ImagePicker, uploaded files (Media → Upload File) or the Canvas. All of these work in the emulator.`}],steps:[{title:`Pick & pitch`,body:`Read the idea cards on this page, or invent your own. Brainstorm at least **three** ideas in 5 minutes, then vote on one. Your app must use at least one **media component**, a **list**, a **procedure** and **if / else**. Write your pitch in the planner card and in your submission notes.`,simple:`Choose an idea card or make your own. Write one sentence about who the app is for and what it does.`,frames:[`For ___, our app ___ so they can ___.`,`The main thing a user does in our app is ___.`,`We picked this idea because ___.`]},{title:`Plan: must-have and nice-to-have`,body:`Fill in the **planner card** on this page:

- **MUST** (max 3): the features your app is useless without
- **NICE**: everything else, only if time is left
- **Who does what**: Builder and Navigator for each sprint

Sketch your screen on paper with every component labeled. Your teacher approves the plan before you code.`,simple:`Write up to 3 must-have features. Write extra ideas as nice-to-have. Draw your screen. Get your teacher's OK.`,frames:[`MUST 1: The user can ___.`,`NICE: It would be cool if ___.`,`In Sprint 1 ___ is Builder and ___ is Navigator.`],stuck:[`More than 3 MUST features? Ask: "Is the app useless without this?" If not, move it to NICE.`]},{title:`Toolbox: blocks you may need`,editor:`blocks`,body:`These blocks were not in earlier lessons. Use them only if your plan needs them. Upload File is how you add your own pictures and sounds to a project.`,simple:`These are new blocks you may need. Only use the ones your plan needs.`,newBlocks:[{name:`Upload File`,where:`Designer → Media panel (under the component tree)`,what:`Adds your own picture or sound file to the project.`},{name:`Canvas.BackgroundImage`,where:`click Canvas1 in the Blocks panel`,what:`Puts a picture behind your drawing. Set it to a file path, like ImagePicker.Selection.`},{name:`Canvas.DrawText`,where:`click Canvas1 in the Blocks panel`,what:`Writes text on the Canvas at an x, y point.`},{name:`Player.Source`,where:`click Player1 in the Blocks panel`,what:`Set it to the name of an uploaded sound, like "cheer.mp3", then call Start.`}],blocks:[`when pickPhoto.AfterPicking do`,`  set Canvas1.BackgroundImage to pickPhoto.Selection`,`when btnCaption.Click do`,`  call Canvas1.DrawText(text: txtCaption.Text, x: 20, y: 40)`]},{title:`Sprint 1: the main feature`,editor:`designer`,day:2,body:"Goal: **MUST 1 works on a phone**, even if it looks plain. The Builder drags components and blocks. The Navigator reads the plan, checks names, and spots mistakes. Use clear names (`btnRecord`, not `Button7`). Log who did what in the contribution log.",simple:`Make your first must-have feature work. One partner builds. The other partner reads the plan and checks.`,check:`Done when: you can show MUST 1 working on a phone to another student.`},{title:`Sprint 2: the rest of the MUST list`,editor:`blocks`,day:3,body:`Swap Builder and Navigator. Goal: **all MUST features work**. Any code that appears in two places should become a procedure. Many media apps use a procedure that refreshes the screen. Check for an empty list **first**:`,simple:`Swap jobs. Make all must-have features work. Put repeated code in a procedure.`,blocks:[`to refreshScreen`,`  if (length of list(get global items) = 0)`,`    set lblStatus.Text to "Nothing here yet. Add something!"`,`  else`,`    set lblTitle.Text to select list item(list: get global items, index: get global current)`,`    set lblStatus.Text to join(get global current, " / ", length of list(get global items))`],check:`Done when: every MUST works, and the app does not crash when the list is empty.`},{title:`Sprint 3: fix and add one NICE`,editor:`blocks`,day:4,body:`Swap jobs again. Goal: **no crashes**, then add **one** NICE feature. Test every button with zero items, one item and many items.`,simple:`Swap jobs. Fix bugs. Add one nice-to-have feature.`,check:`Done when: you tested every button with an empty list and nothing crashed.`},{title:`When you are stuck`,body:`Try these in order before asking the teacher:

1. **Read** the red error or the warning on the block.
2. **Test a smaller piece**: does just that one event work?
3. **Check names**: is it the right component? the right variable?
4. **Ask another company** (2 minutes max).
5. **Ask the teacher**, and say what you already tried.`,simple:`Read the error. Test a small part. Check names. Ask another company. Then ask the teacher.`,frames:[`We expected ___ but instead ___.`,`We already tried ___.`]},{title:`User test with another company`,editor:`phone`,day:6,body:`Swap phones with another company. The testers use your app **without help**. Stay quiet and take notes! Then ask:

1. What did you think the app was for?
2. Where did you get stuck?
3. What is one thing you would add?

Write their top 3 answers in your notes.`,simple:`Another team tries your app. Do not help them. Write down where they got stuck.`,frames:[`The tester thought our app was for ___.`,`They got stuck when ___.`,`We will change ___ because ___.`]},{title:`Polish and ship`,editor:`designer`,day:7,body:"Fix the biggest problem testers found. Then polish: upload an icon picture and set **Screen1 → Icon**, set **AppName**, use clear button labels and matching colors. Test one last time, export the `.aia`, and submit with your pitch, plan and test notes.",simple:`Fix the biggest problem from testing. Add an app icon and name. Export and submit.`,newBlocks:[{name:`Screen1 → Icon`,where:`Designer → select Screen1 → Properties`,what:`The picture people see on their home screen. Upload it first.`},{name:`Screen1 → AppName`,where:`Designer → select Screen1 → Properties`,what:`The name shown under the icon.`}],check:`Done when: the app has an icon and a name, and testers' top problem is fixed.`}],challenge:{title:`Bonus: Ship-quality polish`,body:`Earn the bonus by adding **all three**: (1) a Help button that shows short instructions in a Label, (2) a list of 3 changes you made because of user testing, in your notes, and (3) a 30-second screen recording or video of a real user trying your app, linked in your notes.`},quiz:[{q:`What should your company do FIRST in the design process?`,options:[`Start dragging components into the Designer`,`Decide who the app is for and what it does for them (the pitch)`,`Pick the app icon`,`Write all the blocks for every screen`],answer:1,explain:`Designers start with people. A clear pitch keeps every later decision focused.`},{q:`It is Sprint 2. Your MUST list has 5 features and only 2 work. What is the best move?`,options:[`Add a NICE feature to make it more fun`,`Cut the MUST list to the 3 most important features and finish those`,`Start a new idea`,`Keep all 5 and hope to finish`],answer:1,explain:`A small app that works is better than a big app that crashes. Move extra features to NICE.`},{q:`During a user test, the tester gets confused. What should you do?`,options:[`Grab the phone and show them how`,`Explain the app before they start`,`Stay quiet, write down where they got stuck, and fix it later`,`Tell them they are using it wrong`],answer:2,explain:`Confusion is useful information. Real users will not have you there to explain, so the app has to explain itself.`},{q:`items is an empty list. refreshScreen runs "select list item(items, 1)" BEFORE checking the length. What happens?`,options:[`It shows "Nothing here yet"`,`The app shows an error, because there is no item 1`,`It shows item 0`,`Nothing happens`],answer:1,explain:`Always check for an empty list first. Selecting from an empty list is an error.`}],checks:[{kind:`anyComponent`,types:[`Camera`,`ImagePicker`,`Player`,`SoundRecorder`,`Canvas`],label:`Uses at least one media component`},{kind:`anyBlock`,types:[`lists_create_with`,`lists_add_items`,`lists_select_item`,`lists_pick_random_item`],label:`Uses a list`},{kind:`anyBlock`,types:[`procedures_defnoreturn`,`procedures_defreturn`],label:`Defines a procedure`},{kind:`block`,type:`controls_if`,label:`Uses conditionals`},{kind:`totalBlocks`,min:40,label:`Has at least 40 blocks`}],teacherNotes:`Seven periods: 1 pick/pitch/plan, 3 sprints, 1 stuck-protocol buffer or catch-up, 1 user test, 1 polish. Approve the planner card before coding; steer multiplayer or online ideas toward a single-phone MVP. Every idea card uses only media-path and core skills plus the Toolbox step. Builder/Navigator roles swap each sprint and are logged in the contribution log; read it alongside the .aia check, which proves concepts are present but not who built them. Weigh the pitch, plan and test notes as process evidence.`}],zn=[{id:`tools-forms`,title:`Smart Forms`,subtitle:`Collect input and catch mistakes before they happen`,icon:`📝`,track:`tools`,concepts:[`User input`,`Validation`,`Boolean logic`,`Procedures with results`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Smart Order Form`,description:`An order form for a school snack stand (or your own idea) with a name box, a quantity, a size picker, add-on checkboxes and a pickup date. It will not submit until everything is filled in correctly. Then it shows an order summary.`},objectives:[`Collect different kinds of input with TextBox, CheckBox, Spinner and DatePicker`,`Validate input with "is empty", "is number?" and conditionals before using it`,`Write a formIsValid procedure that gives back true or false`,`Build a readable summary with join and show messages with Notifier`],intro:`Welcome to **Tool Works**! People use tools to get things done. The first rule of a good tool is: **never trust the input**. Users leave boxes blank, type letters where numbers go, and tap Submit too early. Today your company builds a **Smart Order Form**. It checks everything first (that is called **validation**) and explains problems kindly instead of crashing.`,vocab:[{term:`Input`,def:`Information the user gives the app by typing, tapping, choosing, or picking a date.`},{term:`Validation`,def:`Checking that input is complete and makes sense before the app uses it.`},{term:`Boolean`,def:`A value that is either true or false. CheckBox.Checked is a boolean.`},{term:`Notifier`,def:`A non-visible component that shows pop-up messages.`}],steps:[{title:`Lay out the form`,editor:`designer`,body:'New project: `OrderForm`. Inside a **VerticalArrangement** (Width *Fill parent*) add:\n\n- `txtName`: **TextBox**, Hint "Your name"\n- `txtQty`: **TextBox**, Hint "How many?", check **NumbersOnly**\n- `spnSize`: **Spinner**, ElementsFromString `Small, Medium, Large`\n- `chkExtra1` "Add chips" and `chkExtra2` "Add drink": **CheckBoxes**\n- `datePickup`: **DatePicker**, Text "Pick a pickup date"\n- `btnSubmit` (Button) and `lblSummary` (Label)\n- **User Interface → Notifier**',simple:`Make a new project called OrderForm. Put the boxes, pickers and buttons inside a VerticalArrangement.`,newBlocks:[{name:`VerticalArrangement`,where:`Palette → Layout`,what:`A box that stacks components from top to bottom.`},{name:`Spinner`,where:`Palette → User Interface`,what:`A drop-down menu. It always has one choice selected.`},{name:`DatePicker`,where:`Palette → User Interface`,what:`A button that opens a calendar.`},{name:`Notifier`,where:`Palette → User Interface`,what:`Shows pop-up messages.`}]},{title:`Remember if a date was picked`,editor:`blocks`,body:"A DatePicker always has *some* date, even if the user never touched it. So you need a variable that is false until the user really picks one. `AfterDateSet` runs when they do. Fill in the blank.",simple:`Make a variable "dateChosen" that starts as false. When the user picks a date, set it to true.`,blocks:[`initialize global dateChosen to false`,`when datePickup.AfterDateSet do`,`  set global dateChosen to ___`,`  set datePickup.Text to join(datePickup.Month, "/", datePickup.Day, "/", datePickup.Year)`],check:`Test now: pick a date. The button text should change to the date, like 5/14/2026.`},{title:`A procedure that answers a question`,editor:`blocks`,body:`Use **to procedure result** (it has a socket on the left). Its answer is one true/false expression. Use **is number?** (Math drawer) before comparing, so blank or odd text cannot crash the app. Fill in the blank.

You do not need to check the Spinner: it always has a choice.`,simple:`Make a procedure "formIsValid". It gives back true only if the name is filled in, the quantity is a number above 0, and a date was picked.`,blocks:[`to formIsValid result`,`  (not(is empty(txtName.Text)))`,`  and (is number?(txtQty.Text))`,`  and (txtQty.Text > 0)`,`  and (___)`],newBlocks:[{name:`to procedure result`,where:`Procedures drawer`,what:`A procedure that gives back one value, like true or false.`},{name:`is number?`,where:`Math drawer`,what:`True if the text is a number. Use it before comparing with > or <.`}],stuck:[`Want more than two "and" parts? Click the blue gear on the "and" block and drag in more inputs.`,`Error about "> cannot accept" ""? Put "is number?" before the "> 0" part.`]},{title:`Explain the first problem`,editor:`blocks`,body:`formIsValid says **if** something is wrong. A second procedure says **what** is wrong. It shows a message for the first problem it finds. Finish the last two branches yourself: "How many would you like?" and "Pick a pickup date."`,simple:`Make a procedure "showProblem". It shows a message for the first thing that is wrong.`,blocks:[`to showProblem`,`  if is empty(txtName.Text)`,`    call Notifier1.ShowAlert(notice: "Please enter your name.")`,`  else if not(is number?(txtQty.Text)) or (txtQty.Text ≤ 0)`,`    call Notifier1.ShowAlert(notice: ___)`,`  else if ___`,`    call Notifier1.ShowAlert(notice: "Pick a pickup date.")`],stuck:[`Notifier.ShowAlert shows a message, but it does NOT stop the code after it. That is why each message is in its own else-if branch.`]},{title:`Submit only when valid`,editor:`blocks`,day:2,body:'Now Submit is short and easy to read, because the hard work is in the procedures. Build it **from words only**:\n\n- If `call formIsValid` is true: show a summary in `lblSummary` with **join** (name, quantity, `spnSize.Selection`, extras, date).\n- Else: `call showProblem`.\n- For extras: use a local variable that starts as "" and add " + chips" if `chkExtra1.Checked`.',simple:`Build it yourself: if the form is valid, show a summary. If not, show the problem.`,check:`Test now: fill in everything and tap Submit. You should see one summary line, like "Ana: 2 x Large + chips — pickup 5/14/2026".`,stuck:[`"local variable" is in the Variables drawer: "initialize local ___ to ___ in". Put your other blocks inside it.`]},{title:`Try to break it`,editor:`phone`,body:"Swap phones with your partner and try to break each other's forms: leave every box blank, type `0`, skip the date, tap Submit five times. Every mistake should get a friendly message and **no crash**. Fix anything that gets through, then export the `.aia` and submit it.",simple:`Try to break your partner's form. Fix any crash. Export the .aia and submit it.`,check:`Done when: blank name, quantity 0 and no date each show their own message.`}],remix:{title:`Remix: Price tag`,spec:`Show the price in the summary. Small is $2, Medium is $3, Large is $4. Multiply by the quantity, and add $1 for each checked extra.`,hints:[`Make a "to procedure result" called calculatePrice.`,`Use if / else if on spnSize.Selection to pick the size price.`,`Use a local variable for the total, and add 1 for each checked box.`]},challenge:{title:`Bonus: Confirm before ordering`,body:`Use **Notifier.ShowChooseDialog** to ask "Place this order?" with Yes and No buttons. Only show the summary in the **AfterChoosing** event when the choice is "Yes".`},quiz:[{q:`txtName is empty, txtQty is "2", and a date was picked. What does formIsValid give back?`,options:[`true`,`false`,`2`,`An error`],answer:1,explain:`All parts of an "and" must be true. The name is empty, so the first part is false and the answer is false.`},{q:`What is validation?`,options:[`Making the app look nice`,`Checking input is complete and sensible before the app uses it`,`Publishing the app to the store`,`Saving data to the phone`],answer:1,explain:`Validation protects your app and your users from blank or nonsense input.`},{q:`Why is formIsValid a "procedure with result" instead of a plain procedure?`,options:[`Plain procedures cannot contain if blocks`,`It answers a question (true or false) that btnSubmit.Click can use in an if`,`Result procedures run faster`,`Only result procedures can show alerts`],answer:1,explain:`A procedure with a result gives back a value, so "if call formIsValid" can decide what to do.`},{q:`chkExtra1.Checked is true and chkExtra2.Checked is false. Which expression is true?`,options:[`chkExtra1.Checked and chkExtra2.Checked`,`not chkExtra1.Checked`,`chkExtra1.Checked or chkExtra2.Checked`,`chkExtra2.Checked`],answer:2,explain:`"or" is true when at least one side is true. "and" needs both.`}],checks:[{kind:`component`,type:`TextBox`,label:`Has a TextBox`},{kind:`anyComponent`,types:[`CheckBox`,`Spinner`,`DatePicker`],label:`Has a CheckBox, Spinner, or DatePicker`},{kind:`component`,type:`Notifier`,label:`Has a Notifier`},{kind:`block`,type:`text_isEmpty`,label:`Checks for empty input ("is empty")`},{kind:`block`,type:`controls_if`,label:`Uses conditionals to validate`},{kind:`block`,type:`text_join`,label:`Builds a summary with join`},{kind:`anyBlock`,types:[`procedures_defreturn`,`procedures_defnoreturn`],label:`Defines a validation procedure`}],teacherNotes:`The validation is split into formIsValid (a single boolean expression, which fits App Inventor's "to procedure result" socket) and showProblem (an if/else-if chain of alerts). This avoids the "return inside if" pattern App Inventor does not have. App Inventor's "and" stops early, so "is number?" protects the "> 0" comparison. The "try to break it" swap is the most valuable 10 minutes; consider a shout-out for the team that finds the most bugs. Connect validation to real life: what happens when a website accepts a blank email?`},{id:`tools-tinydb`,title:`Saving Data with TinyDB`,subtitle:`Make your app remember things after it closes`,icon:`💾`,track:`tools`,concepts:[`Persistence`,`Key-value storage`,`Lists`,`Screen.Initialize`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Forever To-Do List`,description:`A to-do list that remembers every task, even after the app is closed or the phone restarts. Tap a task to mark it done and remove it.`},objectives:[`Explain the difference between a variable (forgotten when the app closes) and stored data`,`Save and load a list with TinyDB StoreValue and GetValue using a tag`,`Load saved data in Screen1.Initialize, using valueIfTagNotThere for the very first run`,`Add and remove items in a list and keep the ListView and TinyDB in sync`],intro:`Close any app you built so far and open it again. Everything is gone! Variables are short-term memory. Useful tools need **long-term memory**. Programmers call this **persistence**. App Inventor's **TinyDB** is a tiny database on the phone. It saves each value under a name called a **tag**, like a label on a box. Today your company builds a to-do list that never forgets.`,vocab:[{term:`Persistence`,def:`Data that is still there after the app closes.`},{term:`TinyDB`,def:`A non-visible component that saves values on the phone under a text tag.`},{term:`Tag`,def:`The name a value is saved under, like "tasks". Use the exact same tag to get it back.`},{term:`valueIfTagNotThere`,def:`What GetValue gives back if nothing was saved yet, such as an empty list on the first run.`}],steps:[{title:`Design the list`,editor:`designer`,body:'New project: `ForeverToDo`. Add:\n\n- A **HorizontalArrangement** with `txtTask` (TextBox, Hint "New task", Width *Fill parent*) and `btnAdd` (Button "Add")\n- `lstTasks`: **ListView**, Height *Fill parent*\n- `lblCount`: Label\n- **Storage → TinyDB** (non-visible)',simple:`Make a new project called ForeverToDo. Add a TextBox and an Add button in a row, a ListView, a Label and a TinyDB.`,newBlocks:[{name:`TinyDB`,where:`Palette → Storage`,what:`Saves data on the phone so it is still there next time.`}]},{title:`A variable plus a save procedure`,editor:`blocks`,body:`Keep the tasks in a global list while the app runs. Whenever the list changes, call **one** procedure that saves it to TinyDB **and** updates the screen. Then you can never do one and forget the other. Fill in the blank.`,simple:`Make a "tasks" list. Make a procedure "saveAndShow" that saves the list and shows it.`,blocks:[`initialize global tasks to (create empty list)`,`to saveAndShow`,`  call TinyDB1.StoreValue(tag: "tasks", valueToStore: get global tasks)`,`  set lstTasks.Elements to ___`,`  set lblCount.Text to join(length of list(get global tasks), " tasks left")`]},{title:`Load on startup`,editor:`blocks`,body:"`Screen1.Initialize` runs once when the app opens. That is when you load. On the very first run nothing is saved yet, so **valueIfTagNotThere** gives you an empty list instead of an error.",simple:`When the app opens, load the saved list. If nothing is saved, use an empty list.`,blocks:[`when Screen1.Initialize do`,`  set global tasks to call TinyDB1.GetValue(tag: "tasks", valueIfTagNotThere: create empty list)`,`  call saveAndShow`],check:`Test now: you should see "0 tasks left" with no error.`,stuck:[`Error "add items to list: not a list" later? valueIfTagNotThere must be "create empty list", not "".`]},{title:`Add tasks (with validation!)`,editor:`blocks`,day:2,body:`Build \`btnAdd.Click\` **from words only**:

- If the TextBox is **not empty**:
  - add \`txtTask.Text\` to the tasks list
  - clear the TextBox (set it to "")
  - call saveAndShow`,simple:`Build it yourself: if the box is not empty, add the task, clear the box, and save.`,check:`Test now: add "Homework". You should see it in the list and "1 tasks left". Tap Add with an empty box: nothing should be added.`},{title:`Tap to complete`,editor:`blocks`,body:"When a task is tapped, remove it by its position, then save. You need three new blocks. Build it **from words only**:\n\n- Use `when lstTasks.AfterPicking`.\n- Inside it, `remove list item` from the tasks list at index `lstTasks.SelectionIndex`.\n- Then call saveAndShow.",simple:`Build it yourself: when a task is tapped, remove it from the list and save.`,newBlocks:[{name:`ListView.AfterPicking`,where:`click lstTasks in the Blocks panel`,what:`Runs when the user taps a row.`},{name:`ListView.SelectionIndex`,where:`click lstTasks in the Blocks panel`,what:`The position (1, 2, 3…) of the tapped row.`},{name:`remove list item`,where:`Lists drawer`,what:`Removes the item at a position from a list.`}],check:`Test now: tap a task. It should disappear and the count should go down by 1.`,stuck:[`The wrong task disappears? Use SelectionIndex (a number), not Selection (the text).`]},{title:`The real test: close it`,editor:`phone`,body:"Add three tasks. Now **fully close** the app: with the Companion, choose **Connect → Reset Connection** and connect again. Your tasks should come back! Export the `.aia` and submit it.",simple:`Add three tasks. Close the app and open it again. The tasks should still be there.`,check:`Done when: your tasks come back after you reconnect.`,stuck:[`Tasks did not come back? Check that the tag is spelled the same ("tasks") in StoreValue and GetValue.`,`Switched to a different project? The Companion may clear saved data. Test again in this project.`]}],remix:{title:`Remix: Clear all`,spec:`Add a "Clear all" button that empties the whole list and saves, so the count shows "0 tasks left" even after you reopen the app.`,hints:[`Set the tasks variable to "create empty list".`,`Then call the procedure you already have.`]},challenge:{title:`Bonus: Confirm before deleting`,body:`Tapping a task deletes it right away, which is risky! Use **Notifier.ShowChooseDialog** to ask "Mark 'X' as done?" and only remove it in **AfterChoosing** when the choice is "Yes". Save the index in a global variable between the two events.`},quiz:[{q:`You set a global variable, close the app, and open it again. What happens to the value?`,options:[`It is saved automatically`,`It goes back to its "initialize global" value, because variables do not persist`,`It is stored in TinyDB`,`The app will not open`],answer:1,explain:`Variables last only while the app is running. TinyDB keeps data between runs.`},{q:`You saved with tag "tasks" but load with tag "Tasks". What do you get?`,options:[`Your saved list`,`An error message`,`The valueIfTagNotThere value, because tags must match exactly`,`Half of the list`],answer:2,explain:`Tags are exact labels, and capital letters matter. A different tag is a different box.`},{q:`The app runs for the very first time. Nothing is saved yet. What does lblCount show after Initialize?`,options:[`An error`,`"0 tasks left"`,`"tasks left"`,`Nothing`],answer:1,explain:`GetValue gives back the empty list from valueIfTagNotThere. Its length is 0.`},{q:`Why does every change call saveAndShow instead of saving in each event separately?`,options:[`TinyDB can only be called from a procedure`,`One procedure keeps saving and showing together, so the list, screen and database never get out of sync`,`It uses less battery`,`ListView requires it`],answer:1,explain:`With "save + show" in one place, a new feature cannot skip a step by accident.`}],checks:[{kind:`component`,type:`TinyDB`,label:`Has a TinyDB`},{kind:`method`,method:`StoreValue`,label:`Saves data with TinyDB.StoreValue`},{kind:`method`,method:`GetValue`,label:`Loads data with TinyDB.GetValue`},{kind:`event`,component:`Form`,event:`Initialize`,label:`Loads data in "when Screen1.Initialize"`},{kind:`component`,type:`ListView`,label:`Has a ListView`},{kind:`block`,type:`lists_add_items`,label:`Adds items to a list`},{kind:`block`,type:`lists_remove_item`,label:`Removes items from a list`}],teacherNotes:`Two handlers are words-only on purpose; circulate with "which event? which list block?" instead of showing blocks. The most common bug is a tag mismatch ("tasks" vs "Tasks"); have students store the tag in a global variable if they keep making typos. If your school allows installing apps, building the .apk is the strongest persistence demo. Privacy discussion: what kinds of data should an app NOT store on a shared phone?`},{id:`tools-sensors`,title:`Sensors, Maps & Screens`,subtitle:`Use GPS, save a spot, and open a second screen`,icon:`📍`,track:`tools`,concepts:[`Sensors`,`Multiple screens`,`Sharing data between screens`,`Maps`],periods:2,xp:{quiz:50,build:150,bonus:50},project:{name:`Find My Car`,description:`Save your GPS location with one tap ("I parked here"), then open a map screen that puts a pin on the saved spot so you can find your way back.`},objectives:[`Read the phone's location with LocationSensor and the LocationChanged event`,`Save latitude and longitude with TinyDB so another screen can use them`,`Add a second screen and open it with "open another screen"`,`Show a saved location on a Map with a Marker and SetLocation`],intro:`Your phone has many **sensors**: GPS, a motion sensor, a step counter and a compass. Tools become powerful when they react to the real world. Today your company builds **Find My Car**. It saves where you are and shows it on a map later. You will also build your first **two-screen** app. Screens are like separate rooms: they share information through TinyDB.`,vocab:[{term:`Sensor`,def:`A component that measures something in the real world, like location, motion, or steps.`},{term:`Latitude / Longitude`,def:`Two numbers that show any place on Earth (north-south and east-west).`},{term:`Screen`,def:`A separate page of an app with its own components and blocks.`},{term:`Marker`,def:`A pin on a Map component. SetLocation moves it to a latitude and longitude.`}],devices:[{need:`No GPS indoors, or location is blocked`,fallback:`Add a "Use school location" button that saves your school's latitude and longitude (look them up on a map website) instead of the sensor values. The map screen works the same.`},{need:`No phone (emulator only)`,fallback:`The emulator has no real GPS. Use the "Use school location" button above.`},{need:`The map is grey`,fallback:`The school network may block map pictures. The pin still works. Try on a phone hotspot or at home, or show the saved numbers in a Label.`}],steps:[{title:`Screen1: the parking button`,editor:`designer`,body:'New project: `FindMyCar`. On **Screen1** add:\n\n- `lblWhere`: Label ("Waiting for GPS...")\n- `btnPark`: Button, "🅿️ I parked here"\n- `btnFind`: Button, "🗺️ Find my car"\n- **Sensors → LocationSensor**: check **Enabled**, TimeInterval `1000`\n- **Storage → TinyDB**',simple:`Make a new project called FindMyCar. Add a Label, two buttons, a LocationSensor and a TinyDB.`,newBlocks:[{name:`LocationSensor`,where:`Palette → Sensors`,what:`Uses GPS to find the phone's latitude and longitude.`}]},{title:`Watch the location change`,editor:`blocks`,body:"`LocationChanged` runs whenever the phone gets a new GPS reading. It gives you **latitude** and **longitude**. Show them so you know the sensor works. Fill in the blank.",simple:`When the location changes, show the latitude and longitude in the Label.`,blocks:[`when LocationSensor1.LocationChanged latitude longitude altitude speed do`,`  set lblWhere.Text to join("You are at ", get latitude, ", ", ___)`],check:`Test now: near a window you should see two numbers, like "You are at 42.2, -71.4".`,stuck:[`Tapped "Deny" on location? On Android go to Settings → Apps → MIT AI2 Companion → Permissions → Location → Allow.`,`Still "Waiting for GPS"? Indoors GPS is slow. Move near a window, or use the school-location fallback in the device box.`]},{title:`Save the spot`,editor:`blocks`,body:'Build `btnPark.Click` **from words only**:\n\n- If `LocationSensor1.Latitude = 0`: show "No GPS yet. Try again near a window." (0 means no reading yet.)\n- Else: use `TinyDB1.StoreValue` twice, with tag `"carLat"` for Latitude and tag `"carLong"` for Longitude. Then show "Spot saved!"',simple:`Build it yourself: if there is no GPS yet, say so. If there is, save the latitude and longitude.`,check:`Test now: tap Park. You should see "Spot saved!" (or the "No GPS yet" message).`},{title:`Add a map screen`,editor:`designer`,day:2,body:'Click **Add Screen** at the top and name it `MapScreen`. On it add a **Maps → Map** (Width and Height *Fill parent*), a **Maps → Marker** dropped **onto the Map**, a Button `btnBack` ("Back") and a **TinyDB**. Keep its Namespace as `TinyDB1`, the same as Screen1. Back on Screen1:',simple:`Add a second screen called MapScreen with a Map, a Marker, a Back button and a TinyDB. On Screen1, the Find button opens MapScreen.`,blocks:[`when btnFind.Click do`,`  call open another screen(screenName: "MapScreen")`],newBlocks:[{name:`open another screen`,where:`Control drawer`,what:`Opens a screen by its name, in quotes.`},{name:`open another screen with start value`,where:`Control drawer`,what:`Opens a screen and sends it one value. The new screen reads it with "get start value".`},{name:`Map and Marker`,where:`Palette → Maps`,what:`A map of the world, and a pin you can put on it.`}],stuck:[`The new screen does not see Screen1's variables. That is normal. Screens share data through TinyDB (or a start value).`]},{title:`Drop the pin`,editor:`blocks`,body:"Switch the Blocks editor to **MapScreen** with the screen menu at the top. When it opens, load the saved spot and move the marker there. Fill in the blank. Then build `btnBack.Click` yourself: it calls `close screen` (Control drawer).",simple:`On MapScreen, load the saved spot and put the pin there. The Back button closes the screen.`,blocks:[`when MapScreen.Initialize do`,`  initialize local lat to call TinyDB1.GetValue(tag: "carLat", valueIfTagNotThere: 0)`,`  initialize local long to call TinyDB1.GetValue(tag: "carLong", valueIfTagNotThere: 0)`,`  in:`,`    if (get lat = 0)`,`      set Marker1.Visible to false`,`    else`,`      call Marker1.SetLocation(latitude: get lat, longitude: ___)`,`      call Map1.PanTo(latitude: get lat, longitude: get long, zoom: 17)`],check:`Test now: tap Find. You should see the map with a pin on your saved spot. Back returns to Screen1.`,stuck:[`Two "initialize local" blocks: put the second one inside the first, then your if inside the second.`,`Pin in the ocean off Africa? The tags do not match, so it loaded 0. Check "carLat" and "carLong" spelling on both screens.`,`Use "close screen" to go back. Do not open Screen1 again, or you stack up copies of it.`]},{title:`Field test, export and submit`,editor:`phone`,body:"With your teacher's OK, save a spot, walk to the other side of the room or the hallway, and open the map. Is the pin where you parked? GPS indoors can be off by 10–50 meters. Write down what you noticed. Export the `.aia` and submit it.",simple:`Save a spot, walk away, and open the map. Is the pin right? Export the .aia and submit it.`,frames:[`The pin was ___ meters from where we parked.`,`GPS worked better when ___.`]}],remix:{title:`Remix: How long ago?`,spec:`When you park, also save the time. On MapScreen, show "Parked at 3:42 PM" in a Label above the map.`,hints:[`Add a Clock component to both screens. Clock1.Now gives the current time.`,`Save it in TinyDB with a new tag, like "carTime".`,`On MapScreen, use Clock1.FormatTime on the loaded value and show it in the Label.`]},challenge:{title:`Bonus: More sensors`,body:`Turn Find My Car into a walking tool: add a **Pedometer** that counts steps since you parked (reset it in btnPark.Click) and show "Steps from car: N". Or use the **AccelerometerSensor** Shaking event as a hands-free "park here".`},quiz:[{q:`You tap Park while LocationSensor1.Latitude is 0. What happens?`,options:[`The spot 0, 0 is saved`,`lblWhere shows "No GPS yet. Try again near a window." and nothing is saved`,`The app opens MapScreen`,`The app crashes`],answer:1,explain:`The if checks for 0 first. Only the else branch saves to TinyDB.`},{q:`Screen1 sets a global variable. Can MapScreen read it directly?`,options:[`Yes, global means every screen can see it`,`No. Each screen has its own variables, so share data with TinyDB (or a start value)`,`Only if both screens have a Map`,`Only on iPhones`],answer:1,explain:`Screens are like separate rooms. TinyDB is a shared box both can open.`},{q:`Why check whether LocationSensor1.Latitude = 0 before saving?`,options:[`0 means the phone is at the North Pole`,`0 usually means there is no GPS reading yet, so saving it would put the pin in the ocean`,`TinyDB cannot store 0`,`The Map only accepts negative numbers`],answer:1,explain:`Latitude 0, longitude 0 is in the Atlantic Ocean. Treat it as "no reading yet".`},{q:`Which block moves the pin to the saved spot?`,options:[`call Marker1.SetLocation latitude longitude`,`set Map1.Visible to true`,`call open another screen`,`call LocationSensor1.Enabled`],answer:0,explain:`SetLocation places the Marker at the latitude and longitude you give it.`}],checks:[{kind:`anyComponent`,types:[`LocationSensor`,`Pedometer`,`AccelerometerSensor`,`OrientationSensor`],label:`Uses a sensor`},{kind:`screens`,min:2,label:`Has at least 2 screens`},{kind:`block`,type:`controls_openAnotherScreen`,label:`Opens another screen`},{kind:`component`,type:`TinyDB`,label:`Shares data with TinyDB`},{kind:`component`,type:`Map`,label:`Has a Map`},{kind:`method`,method:`SetLocation`,label:`Moves a Marker with SetLocation`}],teacherNotes:`GPS indoors is unreliable; plan a hallway or courtyard walk, or point students to the "Use school location" fallback in the device box. Test that Map tiles load on the school network before class (blocked tiles give a grey map). Location is personal data: discuss why apps ask permission and why sharing your live location is a big deal. Start value is introduced as a callout only; TinyDB is the main way screens share data in this course.`},{id:`tools-capstone`,title:`Capstone: Your Utility App`,subtitle:`Solve a real problem for a real person`,icon:`🛠️`,track:`tools`,concepts:[`User research`,`Requirements`,`Iteration`,`User testing`],periods:8,xp:{quiz:60,build:300,bonus:100},project:{name:`Your Original Utility App`,description:`Your company interviews a real user (a teacher, coach, sibling, or classmate), finds a problem they have, and builds a tool app that solves it, such as a homework tracker, practice log or chore chart.`},objectives:[`Interview a real user and turn what you learn into a problem statement`,`Write up to 3 testable must-have requirements and sketch a wireframe`,`Build in sprints, using TinyDB, two screens, procedures and validation`,`Test with your real user, collect feedback, and improve the app`],intro:`The best tools come from **listening to people**. Product teams interview users, find out what annoys them, and design around it. In this capstone your Tool Works company does the same. You find a real person with a real problem, build an app for them, put it in their hands, and improve it based on what they say.`,vocab:[{term:`User research`,def:`Talking to and watching the people who will use your app to learn what they really need.`},{term:`Problem statement`,def:`"[User] needs a way to [do something] because [reason]."`},{term:`Requirement`,def:`A specific thing the app must do, written so you can test if it works.`},{term:`Feedback`,def:`What users tell you (or show you) after trying your app. Use it to plan the next version.`}],ideas:[{title:`Practice Log`,pitch:`A musician or athlete logs each practice (date + minutes) and sees the total for the week.`,uses:[`TinyDB`,`list of entries`,`validation (is number?)`,`a second screen for history`],stretch:`Show the longest practice.`},{title:`Homework Tracker`,pitch:`A student adds assignments with a due date and taps them off when done.`,uses:[`TinyDB`,`DatePicker`,`ListView + remove list item`,`two screens`],stretch:`Show "due today" items first.`},{title:`Chore Chart`,pitch:`A family member checks off chores each day, and the app remembers what is done.`,uses:[`TinyDB`,`CheckBoxes or ListView`,`saveAndShow procedure`,`a settings screen to add chores`],stretch:`A "reset for a new day" button.`},{title:`Club Attendance`,pitch:`A club leader taps names to mark who came, and sees a count for each meeting.`,uses:[`TinyDB`,`list of names`,`ListView AfterPicking`,`a second screen for past meetings`],stretch:`Show each member's total.`},{title:`Reading Log`,pitch:`A reader logs books with pages read and sees their progress toward a goal.`,uses:[`TinyDB`,`validation`,`math to add up pages`,`two screens`],stretch:`A goal setting saved in TinyDB.`}],devices:[{need:`Your user has an iPhone`,fallback:`Your user can test on the iPhone Companion, or try the app on your phone during the test.`},{need:`Installing an .apk is blocked`,fallback:`Skip the .apk. Your user tests the app on your phone with the Companion while you watch.`},{need:`No phone (emulator only)`,fallback:`Run the user test in the emulator on your computer. TinyDB works there too.`}],steps:[{title:`Find your user and interview them`,body:`Choose one real person who is not in your company, such as a teacher, coach, family member or club leader. Interview them for 5–10 minutes. Write down their answers. Pick an idea card only if it matches what they said.`,simple:`Pick a real person. Ask them what they keep track of and what is hard about it. Write down what they say.`,frames:[`What is something you keep track of every day or week?`,`What part of it is annoying or easy to forget?`,`How do you do it now (paper, memory, another app)?`,`If an app helped, what is the ONE thing it must do?`]},{title:`Problem statement and plan`,day:2,body:`Write your **problem statement**. Then fill in the **planner card** on this page:

- **MUST** (max 3): testable requirements, like "The user can add a practice with minutes, and it is still there after the app restarts"
- **NICE**: everything else
- **Who does what** in each sprint

Your app must use TinyDB, at least 2 screens, a procedure and validation. Your teacher approves the plan before you code.`,simple:`Write one sentence about the user's problem. Write up to 3 must-have features. Get your teacher's OK.`,frames:[`___ needs a way to ___ because ___.`,`MUST 1: The user can ___, and we can test it by ___.`,`Our TinyDB tags will be: ___.`],stuck:[`Idea needs accounts, messages between phones, or online data? Shrink it to one phone. That is your MVP.`]},{title:`Sprint 1: the main screen`,editor:`designer`,day:3,body:`Goal: **MUST 1 works on Screen1**. The Builder drags components and blocks; the Navigator reads the plan and checks names and tags. Write your TinyDB tags on paper first. A mismatched tag is the #1 bug in two-screen apps. Log who did what in the contribution log.`,simple:`Make your first must-have work on Screen1. One partner builds. The other checks the plan and names.`,check:`Done when: you can add data, close the app, open it again, and the data is still there.`},{title:`Sprint 2: the backbone`,editor:`blocks`,day:4,body:`Swap Builder and Navigator. Good tool apps use the same backbone you used all path long: **load** in Initialize → **validate** input → **change** the data → call **one** procedure that saves and refreshes. Make sure your app has this shape:`,simple:`Swap jobs. Load when the app opens. Check the input. Change the list. Save and show it with one procedure.`,blocks:[`when Screen1.Initialize do`,`  set global records to call TinyDB1.GetValue(tag: "records", valueIfTagNotThere: create empty list)`,`  call saveAndShow`,`when btnAdd.Click do`,`  if is empty(txtEntry.Text)`,`    call Notifier1.ShowAlert(notice: "Type something first!")`,`  else`,`    call add items to list(list: get global records, item: txtEntry.Text)`,`    call saveAndShow`],check:`Done when: blank input shows a message, and good input is saved and shown.`},{title:`Sprint 3: the second screen`,editor:`blocks`,day:5,body:"Swap jobs again. Goal: **all MUST features work**, including your second screen. The second screen loads its data from TinyDB with the **same tags**. Use `close screen` to go back.",simple:`Swap jobs. Finish the second screen. Use the same TinyDB tags on both screens.`,check:`Done when: data saved on one screen shows up on the other screen.`,stuck:[`Data "disappears" on the second screen? Compare the tags letter by letter. "log" and "logs" are different.`]},{title:`When you are stuck`,body:`Try these in order before asking the teacher:

1. **Read** the red error or the warning on the block.
2. **Test a smaller piece**: does just that one event work?
3. **Check names and tags**: right component? same tag on both screens?
4. **Ask another company** (2 minutes max).
5. **Ask the teacher**, and say what you already tried.`,simple:`Read the error. Test a small part. Check names and tags. Ask another company. Then ask the teacher.`,frames:[`We expected ___ but instead ___.`,`We already tried ___.`]},{title:`Test with your real user`,editor:`phone`,day:7,body:`Put the app in your user's hands (or a classmate acting as them) and give them a real task: "Log yesterday's practice." **Do not help.** Watch where they stop or look confused. Afterward, ask the questions below and write down their answers.`,simple:`Your user tries the app. Do not help. Watch where they get stuck. Ask what to change.`,frames:[`Would you really use this? Why or why not?`,`Where did you get stuck?`,`What would make it better?`,`Our user got stuck when ___, so we will ___.`]},{title:`Improve and ship`,editor:`designer`,day:8,body:'Fix the most important feedback first. Then polish: upload an icon picture and set **Screen1 → Icon**, set **AppName**, use clear labels and friendly error messages. Test the "first run" (no data) and "full list" cases. Export the `.aia` and submit with your problem statement, plan and user feedback.',simple:`Fix the biggest problem your user found. Add an icon and app name. Test, export and submit.`,newBlocks:[{name:`Upload File`,where:`Designer → Media panel`,what:`Adds a picture to your project, for example an icon.`},{name:`Screen1 → Icon`,where:`Designer → select Screen1 → Properties`,what:`The picture people see on their home screen.`}],check:`Done when: your user's top problem is fixed, and the app works with no data and with lots of data.`}],challenge:{title:`Bonus: Ship it to your user`,body:`If your school allows it, build the **.apk** (Build → Android App) and install it on your user's device (with their permission). Have them use it for a few days. Add a short "what changed after real use" note, one feature they asked for, and a quote from your user.`},quiz:[{q:`Why interview a real user before building?`,options:[`It is required by App Inventor`,`So you build something people actually need instead of guessing`,`To get their Google password`,`Interviews make the app run faster`],answer:1,explain:`User research replaces guesses with real information about what bothers people.`},{q:`Which is the best-written requirement?`,options:[`The app should be good`,`The app is easy`,`The user can add a task with a due date, and it is still there after the app restarts`,`The app uses lots of blocks`],answer:2,explain:`A good requirement is specific and testable: you can check yes or no whether it works.`},{q:`Screen1 saves with tag "log" and Screen2 loads tag "logs". What does Screen2 show?`,options:[`The saved data`,`Only the valueIfTagNotThere value, so the data seems to disappear`,`App Inventor fixes the tag automatically`,`The data twice`],answer:1,explain:`Tags must match exactly. Agree on tag names as a team and write them down.`},{q:`Your user says the app is confusing. What is the best response?`,options:[`Explain that they are using it wrong`,`Ask where exactly they got stuck, then change the design and test again`,`Add more buttons`,`Find a different user who likes it`],answer:1,explain:`Feedback drives improvement. Find the exact stuck point, fix it, and test again.`}],checks:[{kind:`component`,type:`TinyDB`,label:`Saves data with TinyDB`},{kind:`screens`,min:2,label:`Has at least 2 screens`},{kind:`anyBlock`,types:[`procedures_defnoreturn`,`procedures_defreturn`],label:`Defines a procedure`},{kind:`block`,type:`controls_if`,label:`Uses conditionals (validation)`},{kind:`totalBlocks`,min:40,label:`Has at least 40 blocks`}],teacherNotes:`Eight periods: 1 interview, 1 problem statement + plan, 3 sprints, 1 stuck/catch-up buffer, 1 user test, 1 improve + ship. Line up "client" volunteers in advance (staff, coaches, older students) and brief them to give honest feedback. Approve the planner card before coding. Partners swap Builder/Navigator each sprint instead of splitting screens, because App Inventor cannot merge two people's screens into one project; the contribution log records who did what. Weigh the problem statement, plan and feedback notes as heavily as the .aia checks.`}],Bn=[{id:`launch-day`,title:`Launch Day`,subtitle:`Polish, publish, pitch, and look back`,icon:`🚀`,track:`launch`,concepts:[`App identity`,`Building an APK`,`Testing with new users`,`Pitching`,`Reflection`],periods:3,xp:{quiz:50,build:200,bonus:100},project:{name:`Your Launch Build`,description:`Your capstone app with a real name, icon, and version number, built into an installable app, tested by someone who has never seen it, and pitched to the class.`},objectives:[`Set the app's identity: AppName, Icon, Title, and VersionName`,`Build an installable Android .apk`,`Test with a brand-new user and fix what they find`,`Pitch the app live, on video, or in writing with a demo`,`Reflect on what you learned and what you could build next on your own`],intro:`Real companies do not just build apps. They **ship** them. Today your capstone goes from "project" to "product". You give it a real name and icon, build a file people can install, watch a new user try it, and **pitch** it to the class. Then you look back at how far your company has come.`,vocab:[{term:`APK`,def:`The file you install to put an app on an Android phone.`},{term:`Version`,def:`A label like 1.0 or 1.1 that tells users which release they have.`},{term:`Fresh user`,def:`Someone who has never seen your app before.`},{term:`Pitch`,def:`A short talk that shows why your app is worth trying.`}],steps:[{title:`Give your app an identity`,editor:`designer`,body:`Open your capstone and select **Screen1**. In Properties (some are under **Project Properties**, the gear button), set:

- **AppName**: the name under the icon (12 letters or fewer)
- **Icon**: upload a square PNG of your logo (512×512 works well)
- **Title**: the text at the top of the screen
- **VersionName** \`1.0\` and **VersionCode** \`1\``,simple:`Select Screen1. Give the app a short name, an icon picture, a title, and version 1.0.`,check:`Test now: the title at the top of the app on your phone shows your new Title.`,newBlocks:[{name:`Icon`,where:`Screen1 → Icon (Project Properties)`,what:`The picture people tap to open your app.`},{name:`VersionName`,where:`Screen1 → VersionName (Project Properties)`,what:`The version label, like 1.0.`}],stuck:[`Cannot find AppName or Icon? Click the gear (Project Properties) button above the Properties panel.`,`Icon looks stretched? Use a square picture.`]},{title:`Final polish checklist`,editor:`designer`,body:`Go through this checklist as a team:

- Every component has a clear name (no \`Button7\`)
- No leftover text like "Text for Label1"
- Text is big enough and easy to read
- Every button does something, or is removed
- Blocks: right-click the workspace → **Clean up Blocks**, then fix every ⚠ warning and ✖ error at the bottom left`,simple:`Check names, leftover text, readable text, and buttons. Clean up blocks and fix warnings and errors.`,check:`Done when: the warning and error counters at the bottom left of Blocks both show 0.`},{title:`Build the .apk`,editor:`phone`,body:`1. Choose **Build → Android App (.apk)**.
2. Wait for the progress bar. Big pictures and sounds make it slower.
3. Scan the QR code with an Android phone to install, or click **Download .apk**.

The phone may ask to allow installs from unknown sources. Ask your teacher first on a school device. **iPhone, or installs blocked?** Keep using the Companion for your demo. That is fine.`,simple:`Click Build → Android App. Scan the QR code to install it. On an iPhone, use the Companion instead.`,check:`Test now: the app opens from its own icon on an Android phone (or still runs in the Companion).`},{title:`Test with a fresh user`,day:2,body:"You already tested with another company during the capstone. Now find a **fresh user**: someone who has never seen your app (a student from another class, a younger student, or a family member at home). Give them ONE sentence of instructions, then watch quietly and take notes. Fix at least one problem, change **VersionName** to `1.1`, and rebuild.",simple:`Find someone who never saw your app. Say one sentence, then watch. Write down problems. Fix one and change the version to 1.1.`,frames:[`They got stuck when ___.`,`They tried to ___, but the app ___.`,`They smiled when ___.`,`In version 1.1 we fixed ___.`]},{title:`Prepare your pitch`,body:`Choose the format that fits your team:

- **Live** in front of the class (60 seconds)
- **Recorded video** of your pitch and demo
- **Written pitch** (one paragraph) plus a demo the class can try

Every partner has a part. Use the frames that fit your app. Practice with a timer twice, and keep a screen recording as a backup demo.`,simple:`Pick live, video, or written. Everyone has a part. Use the sentence starters. Practice two times.`,frames:[`Our app is called ___. It is a ___ (game / tool / media app).`,`It is for ___ who want to ___. / In our game you ___.`,`Watch this: ___ (show the best feature).`,`The hardest part to build was ___, and we solved it by ___.`,`In version 2.0 we would add ___.`]},{title:`Launch and submit`,day:3,body:`Give your pitch. Then export the final \`.aia\` and submit it with a link to your .apk, video, or written pitch in the link box. Fill in the contribution log for each partner.
